<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liga Aí!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Silkscreen&family=Lexend:wght@400;500;700&display=swap">
<style>
/* Layout: placa de circuito impresso. Máscara verde, trilhas de cobre, serigrafia branca e LEDs de verdade. */
:root {
  color-scheme: dark;
  --placa: #0C5A3C;
  --placa-escura: #083F2A;
  --placa-clara: #127350;
  --cobre: #D79A4A;
  --ouro: #FFD166;
  --serigrafia: #F2F7F1;
  --suave: #B6D6C4;
  --led: #FFE14D;
  --vermelho: #FF5C5C;
  --verde-led: #58F29B;
  --noite: #0D1B2F;
  --display: "Bungee", Impact, sans-serif;
  --etiqueta: "Silkscreen", "Courier New", monospace;
  --texto: "Lexend", "Segoe UI", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--placa-escura);
  background-image: radial-gradient(circle, rgba(215, 154, 74, .55) 2px, transparent 2.5px), linear-gradient(90deg, rgba(215, 154, 74, .13) 2px, transparent 2px), linear-gradient(rgba(215, 154, 74, .13) 2px, transparent 2px);
  background-size: 96px 96px, 192px 96px, 96px 192px;
  color: var(--serigrafia);
  font: 400 1.03rem/1.55 var(--texto);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px;
}
#app { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3, p { margin: 0; }
h2 { font: 400 clamp(1.45rem, 5vw, 2.15rem)/1.15 var(--display); text-wrap: balance; }
h3 { font: 400 1.05rem/1.2 var(--display); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ouro); outline-offset: 2px; }

.modulo { position: relative; background: var(--placa); border: 2px solid var(--serigrafia); border-radius: 4px; padding: clamp(16px, 4vw, 28px); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.modulo::before, .modulo::after { content: ""; position: absolute; top: 8px; width: 11px; height: 11px; border-radius: 50%; background: var(--placa-escura); border: 2px solid var(--cobre); }
.modulo::before { left: 8px; }
.modulo::after { right: 8px; }
.etiqueta { font: 400 .78rem/1.35 var(--etiqueta); color: var(--suave); }
.bt { min-height: 50px; padding: 10px 20px; border: 2px solid var(--serigrafia); border-radius: 4px; background: transparent; font: 400 .92rem/1.15 var(--display); transition: background .1s, transform .07s; }
.bt:hover:not(:disabled) { background: var(--placa-clara); }
.bt:active:not(:disabled) { transform: translateY(2px); }
.bt:disabled { opacity: .45; cursor: not-allowed; }
.bt.liga { background: var(--led); border-color: var(--led); color: #1A2410; box-shadow: 0 0 18px rgba(255, 225, 77, .5); }
.bt.liga:hover:not(:disabled) { background: #FFEB85; }
.linha { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.linha.fim { justify-content: flex-end; }

.logo { font: 400 clamp(2.6rem, 12vw, 5.4rem)/1 var(--display); color: var(--led); text-shadow: 0 0 22px rgba(255, 225, 77, .75); overflow-wrap: anywhere; }
.logo.menor { font-size: clamp(1.5rem, 7vw, 2.8rem); }
.sub { font: 500 1.08rem/1.35 var(--texto); }
.inicio { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; align-items: stretch; }
.campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 150px; }
.campo label { font: 400 .8rem/1.2 var(--etiqueta); }
.campo input { min-height: 48px; width: 100%; padding: 8px 12px; border: 2px solid var(--suave); border-radius: 4px; background: var(--placa-escura); font: 500 1.03rem/1.2 var(--texto); }
.campo input::placeholder { color: var(--suave); }
.aviso { border: 1px dashed var(--suave); padding: 9px 11px; font-size: .88rem; }
.erro { color: #FFD0D0; font-weight: 700; min-height: 1.5em; font-size: .92rem; }
.formulario { display: flex; flex-direction: column; gap: 12px; }
.niveis { margin: 0; padding: 0; border: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 112px), 1fr)); gap: 7px; }
.niveis legend { font: 400 .8rem/1.2 var(--etiqueta); padding: 0 0 5px; }
.nivel { display: flex; gap: 7px; align-items: flex-start; padding: 7px 9px; border: 2px solid var(--suave); border-radius: 4px; cursor: pointer; }
.nivel:has(input:checked) { border-color: var(--led); background: var(--placa-escura); }
.nivel input { margin: 4px 0 0; accent-color: var(--led); }
.nivel span { display: flex; flex-direction: column; min-width: 0; }
.nivel b { font: 700 .92rem/1.2 var(--texto); }
.nivel small { font-size: .74rem; line-height: 1.25; color: var(--suave); }

.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font: 400 .8rem/1.2 var(--etiqueta); padding: 2px; }
.barra strong { font: 400 1.15rem/1 var(--display); color: var(--led); font-variant-numeric: tabular-nums; }
.barra .esp { flex: 1; }
.barra button { min-height: 38px; padding: 4px 10px; background: var(--placa-escura); border: 1px solid var(--suave); border-radius: 4px; font: 400 .74rem/1 var(--etiqueta); }

/* Escola no apagão */
.escola { display: block; width: 100%; height: auto; background: var(--noite); border-radius: 3px; }
.escola .predio { fill: #24344B; }
.escola .telhado { fill: #182536; }
.escola .porta { fill: #111C2B; }
.escola .jan { fill: #0B1320; stroke: #3F5472; stroke-width: 2; transition: fill .5s; }
.escola .jan.acesa { fill: var(--led); filter: drop-shadow(0 0 7px var(--led)); }
.escola text { font: 400 8.5px var(--etiqueta); fill: #9FB2CD; }
.escola .estrela { fill: #E8EEF8; }

.fases { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 9px; }
.fase { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 2px 10px; text-align: left; padding: 11px; border: 2px solid var(--serigrafia); border-radius: 4px; background: var(--placa-escura); }
.fase:hover:not(:disabled) { background: var(--placa-clara); }
.fase:disabled { border-style: dashed; opacity: .55; cursor: not-allowed; }
.fase .lamp { grid-row: 1 / span 3; align-self: center; width: 22px; height: 22px; border-radius: 50%; margin: auto; background: #233; border: 2px solid var(--suave); }
.fase .lamp.ok { background: var(--led); border-color: var(--led); box-shadow: 0 0 12px var(--led); }
.fase .tg { font: 400 .76rem/1.3 var(--texto); color: var(--suave); }
.fase .pe { display: flex; justify-content: space-between; gap: 8px; font: 400 .72rem/1.3 var(--etiqueta); }
.estrelas { color: var(--led); letter-spacing: .08em; }

.leitura { display: flex; flex-direction: column; gap: 11px; max-width: 66ch; }
.destaque { color: var(--led); font-weight: 700; }
.curiosidade { border: 2px solid var(--cobre); padding: 9px 12px; }

.como { font-size: .92rem; color: var(--suave); }
.grande { min-height: 66px; min-width: 190px; font-size: 1.2rem; touch-action: manipulation; }
.fileira { display: grid; grid-template-columns: repeat(auto-fit, minmax(58px, 1fr)); gap: 7px; }
.bulbo { display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 76px; padding: 8px 2px; background: var(--placa-escura); border: 2px solid var(--suave); border-radius: 4px; font: 400 .8rem/1 var(--etiqueta); }
.bulbo i { width: 28px; height: 28px; border-radius: 50%; background: #233; border: 2px solid var(--suave); }
.bulbo:hover:not(:disabled) { border-color: var(--led); }
.bulbo.passa i { background: var(--led); border-color: var(--led); box-shadow: 0 0 12px var(--led); }
.bulbo.corta { opacity: .6; }
.bulbo.achada { opacity: 1; border-color: var(--vermelho); }
.bulbo.achada i { background: var(--vermelho); border-color: var(--vermelho); }
.pista { position: relative; height: 84px; overflow: hidden; background: repeating-linear-gradient(90deg, #17324A 0 22px, #122739 22px 44px); border-block: 4px solid var(--cobre); }
.item { position: absolute; top: 15px; left: 0; padding: 12px 14px; background: var(--serigrafia); color: #123; border-radius: 4px; font-weight: 700; white-space: nowrap; line-height: 1; }
.item.bom { background: var(--verde-led); }
.item.ruim { background: var(--vermelho); }
@keyframes passa { from { left: -30%; } to { left: 100%; } }
.caixas { display: grid; grid-template-columns: repeat(var(--c), minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.caixa { min-height: 72px; padding: 6px; background: var(--placa-escura); border: 2px solid var(--led); border-radius: 4px; font: 400 clamp(.74rem, 2.6vw, .95rem)/1.1 var(--display); overflow-wrap: anywhere; }
.caixa:hover { background: var(--placa-clara); }
.corpo-jogo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; max-width: 420px; margin-inline: auto; }
.orgao { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 96px; background: var(--placa-escura); border: 2px solid var(--suave); border-radius: 4px; font-weight: 500; transition: background .08s, box-shadow .08s; }
.orgao b { font-size: 1.9rem; line-height: 1; font-weight: 400; }
.orgao.ativo { background: var(--led); border-color: var(--led); color: #1A2410; box-shadow: 0 0 22px var(--led); }
.ceu { display: block; width: min(100%, 320px); margin: 0 auto 10px; background: var(--noite); border-radius: 50%; }
/* O circuito */
.circuito { --n: 5; display: grid; grid-template-columns: 30px repeat(var(--n), minmax(0, 1fr)) 34px; gap: 3px; max-width: 500px; width: 100%; margin-inline: auto; touch-action: manipulation; }
.ponta { display: grid; place-items: center; align-self: stretch; }
.bateria { width: 26px; height: 46px; background: linear-gradient(90deg, var(--cobre), #1B1B1B 40%); border-radius: 3px; display: grid; place-items: center; font: 400 .7rem/1 var(--etiqueta); color: var(--ouro); }
.lampada { width: 30px; height: 30px; border-radius: 50%; background: #233; border: 2px solid var(--suave); }
.lampada.acesa { background: var(--led); border-color: var(--led); box-shadow: 0 0 22px 6px rgba(255, 225, 77, .85); }
.peca { position: relative; aspect-ratio: 1; padding: 0; border: 0; border-radius: 3px; background: var(--placa-escura); min-width: 0; }
.peca:hover:not(:disabled) { background: #0A4B33; }
.peca:disabled { cursor: default; }
.peca svg { display: block; width: 100%; height: 100%; transition: transform .14s; }
.peca .trilha { fill: none; stroke: var(--cobre); stroke-width: 15; stroke-linecap: square; }
.peca.viva .trilha { stroke: var(--led); filter: drop-shadow(0 0 3px var(--led)); }
.peca .chave { position: absolute; inset: 22%; display: grid; place-items: center; background: var(--placa); border: 2px solid var(--serigrafia); border-radius: 50%; font: 400 .9rem/1 var(--display); color: var(--serigrafia); pointer-events: none; }
.peca.viva .chave { border-color: var(--led); color: var(--led); }
.peca .chave.fechada { background: var(--verde-led); border-color: var(--verde-led); color: #063; }
.peca .chave.queimada { background: var(--vermelho); border-color: var(--vermelho); color: #300; }
.estado { min-height: 1.5em; text-align: center; font-weight: 500; font-size: .95rem; }

.enunciado { font: 700 clamp(1.08rem, 3.2vw, 1.28rem)/1.4 var(--texto); text-wrap: pretty; }
.opcoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 8px; }
.op { min-height: 52px; padding: 9px 13px; text-align: left; background: var(--placa-escura); border: 2px solid var(--suave); border-radius: 4px; line-height: 1.3; font-size: .96rem; }
.op:hover:not(:disabled) { border-color: var(--led); }
.op:disabled { cursor: default; color: var(--serigrafia); }
.op.certa { background: var(--verde-led); border-color: var(--verde-led); color: #042A17; font-weight: 700; }
.op.certa::before { content: "✓ "; }
.op.errada { background: var(--vermelho); border-color: var(--vermelho); color: #2B0505; font-weight: 700; }
.op.errada::before { content: "✗ "; }
.op.apagada { opacity: .45; }
.retorno { border: 2px solid var(--led); padding: 11px 13px; display: flex; flex-direction: column; gap: 8px; font-size: .96rem; }
.retorno b { color: var(--led); }
.tempo { height: 10px; border: 1px solid var(--serigrafia); }
.tempo div { height: 100%; background: var(--led); transition: width .25s linear; }
.modal { position: fixed; inset: 0; z-index: 20; overflow-y: auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); background: rgba(3, 25, 16, .82); }
.modal .modulo { max-width: 620px; margin: 0 auto; }

.placar { font: 400 clamp(2.5rem, 10vw, 4rem)/1 var(--display); color: var(--led); font-variant-numeric: tabular-nums; }
.grandes { font-size: 1.8rem; letter-spacing: .1em; color: var(--led); }
.abas { display: flex; flex-wrap: wrap; gap: 8px; }
.abas button { min-height: 42px; padding: 6px 12px; background: transparent; border: 2px solid var(--suave); border-radius: 4px; font: 400 .78rem/1 var(--etiqueta); }
.abas button[aria-pressed="true"] { background: var(--led); border-color: var(--led); color: #1A2410; }
.tab { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.tab li { display: grid; grid-template-columns: 2.3em minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 8px 10px; background: var(--placa-escura); border-radius: 3px; }
.tab li.eu { outline: 2px solid var(--led); }
.tab .pos { font: 400 .95rem/1 var(--display); color: var(--ouro); }
.tab .nm { overflow-wrap: anywhere; font-weight: 500; }
.tab small { color: var(--suave); font: 400 .68rem/1 var(--etiqueta); }
.tab .pt { font: 400 1rem/1 var(--display); font-variant-numeric: tabular-nums; }
@media (max-width: 680px) {
  .inicio { grid-template-columns: minmax(0, 1fr); }
  .escola.topo { max-height: 180px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
"use strict";
/* ---------- CONTEÚDO DO JOGO: a primeira opção de cada pergunta é a certa; o jogo embaralha ---------- */
const Q = (q, o, p) => ({ q, o, a: 0, p });
const BANCO = {
  metodo: [
    Q("O que é uma hipótese?", ["Uma explicação que pode ser testada", "Uma verdade que nunca muda", "Um resultado já comprovado", "Uma opinião sem relação com o problema"], "A hipótese é uma resposta provisória. O experimento mostra se ela se sustenta."),
    Q("Você quer saber se a luz ajuda o feijão a crescer. O que deve mudar entre os dois vasos?", ["Só a quantidade de luz", "A luz, a água e o tipo de terra", "Só o nome dos vasos", "Tudo, para ver o que acontece"], "Mudamos uma coisa de cada vez. Assim sabemos o que causou a diferença."),
    Q("Por que repetir um experimento várias vezes?", ["Para saber se o resultado se mantém", "Para gastar mais material", "Para escolher o resultado preferido", "Porque a primeira vez nunca vale"], "A repetição reduz a chance de o resultado ter sido por acaso."),
    Q("O teste deu resultado diferente da sua hipótese. Isso é:", ["Uma informação útil para revisar a ideia", "Um motivo para esconder os dados", "Um sinal de que a ciência não funciona", "Um motivo para mudar os números"], "Hipóteses recusadas fazem parte da ciência e levam a novas perguntas."),
    Q("Qual destas frases é uma observação?", ["A planta do vaso A cresceu 5 cm", "A planta do vaso A é a mais bonita", "Toda planta gosta de música", "Essa planta deve ser feliz"], "Observação descreve o que foi percebido ou medido, sem julgamento."),
    Q("Para que serve um grupo de controle?", ["Comparar com o que recebeu o teste", "Vigiar os alunos da turma", "Fazer o experimento durar mais", "Evitar anotar os resultados"], "Sem algo para comparar, não dá para saber se o que foi testado fez diferença."),
    Q("Qual é a melhor forma de registrar um experimento?", ["Anotar data, medidas e o que foi feito", "Guardar tudo só na memória", "Anotar apenas o que deu certo", "Escrever só o resultado final"], "Um bom registro permite que outra pessoa repita e confira o seu trabalho."),
    Q("Duas coisas aconteceram juntas. Isso prova que uma causou a outra?", ["Não, é preciso investigar", "Sim, sempre", "Sim, se aconteceu duas vezes", "Só se alguém famoso disser"], "Acontecer junto não prova causa. Um teste controlado ajuda a descobrir."),
    Q("Viu uma notícia científica surpreendente. O que fazer primeiro?", ["Procurar a fonte e outras confirmações", "Compartilhar logo com todos", "Acreditar porque tem muitas curtidas", "Ignorar toda a ciência"], "Fontes confiáveis e a confirmação de outros estudos dão mais segurança."),
    Q("Em que ordem costuma funcionar uma investigação?", ["Pergunta, hipótese, teste, conclusão", "Conclusão, pergunta, teste, hipótese", "Teste, conclusão, hipótese, pergunta", "Hipótese, conclusão, pergunta, teste"], "A ordem ajuda a organizar o raciocínio, e cada resultado pode gerar nova pergunta.")
  ],
  energia: [
    Q("Para o LED acender, o circuito precisa estar:", ["Fechado, com caminho completo", "Aberto, com um fio solto", "Sem nenhuma fonte de energia", "Molhado"], "A corrente só circula quando há um caminho completo, saindo e voltando à fonte."),
    Q("Qual destes materiais é um bom condutor de eletricidade?", ["Cobre", "Borracha", "Plástico", "Madeira seca"], "Metais como o cobre conduzem bem. Por isso os fios são de metal."),
    Q("Por que os fios têm uma capa de plástico?", ["O plástico é isolante e protege", "O plástico aumenta a corrente", "Só para deixar o fio colorido", "Para o fio ficar mais pesado"], "O isolante evita choques e impede que os fios encostem e causem curto-circuito."),
    Q("O LED não acendeu. Qual pode ser o motivo?", ["Ele foi ligado invertido", "Ele é muito colorido", "A sala está clara", "Ele é pequeno demais"], "O LED tem lado certo: a corrente passa em um só sentido."),
    Q("Que transformação acontece em uma pilha ligada?", ["Energia química vira elétrica", "Luz vira som", "Calor vira água", "Eletricidade vira pilha nova"], "Reações químicas dentro da pilha geram a corrente elétrica."),
    Q("Um ventilador transforma energia elétrica principalmente em:", ["Movimento", "Luz", "Comida", "Água"], "O motor converte eletricidade em movimento. Parte vira calor."),
    Q("O que um painel solar faz?", ["Transforma luz em eletricidade", "Transforma vento em luz", "Guarda água da chuva", "Esfria o sol"], "Células fotovoltaicas geram corrente quando a luz do Sol as atinge."),
    Q("Qual é a unidade da tensão elétrica?", ["Volt", "Metro", "Litro", "Grama"], "Pilhas comuns têm 1,5 volt. A tomada da parede tem muito mais."),
    Q("O que é um curto-circuito?", ["Corrente passando por um caminho sem resistência", "Um circuito muito pequeno", "Uma lâmpada apagada", "Um fio bem colorido"], "A corrente sobe muito e pode esquentar os fios. Por isso é perigoso."),
    Q("Na sala maker, qual projeto é seguro para experimentar?", ["Pilha pequena e LED", "Fios ligados na tomada", "Abrir um carregador ligado", "Usar a tomada com as mãos molhadas"], "Tomadas podem matar. Experimente sempre com baixa tensão e com orientação.")
  ],
  materia: [
    Q("Quais são os três estados físicos mais comuns da matéria?", ["Sólido, líquido e gasoso", "Quente, frio e morno", "Grande, médio e pequeno", "Metal, vidro e plástico"], "A mesma substância pode mudar de estado, como a água em gelo, líquido e vapor."),
    Q("Quando a roupa seca no varal, a água:", ["Evapora", "Desaparece da natureza", "Vira tecido", "Vira sal"], "A água passa para o estado gasoso e se mistura ao ar."),
    Q("As gotinhas por fora de um copo gelado vêm:", ["Do vapor de água do ar", "De dentro do vidro", "Do gelo atravessando o copo", "Do próprio vidro derretendo"], "O vapor do ar esfria ao tocar o copo e condensa."),
    Q("Água com sal bem dissolvido é:", ["Uma mistura homogênea", "Uma substância pura", "Um gás", "Um metal"], "Na mistura homogênea, não dá para ver as partes separadas."),
    Q("Por que um pedaço de madeira costuma boiar na água?", ["É menos denso que a água", "É mais pesado que qualquer pedra", "A água empurra só o que é pequeno", "A madeira não tem massa"], "O que importa é a densidade, a relação entre massa e volume."),
    Q("Como separar areia da água?", ["Por filtração", "Por imã", "Com um ventilador", "Esperando a areia evaporar"], "O filtro deixa o líquido passar e retém os grãos."),
    Q("O PLA da impressora 3D derrete e depois endurece. Isso é:", ["Uma transformação física", "O nascimento de um novo elemento", "Uma fotossíntese", "Uma evaporação"], "O material muda de forma e estado, mas continua sendo PLA."),

/* Lados de uma peça: 1 cima, 2 direita, 4 baixo, 8 esquerda. */
const LADOS = [[0, -1, 1, 4], [1, 0, 2, 8], [0, 1, 4, 1], [-1, 0, 8, 2]];
const gira = m => ((m << 1) & 15) | (m >> 3);

function caminho(col, lin) {
  const ini = [0, Math.floor(Math.random() * lin)], fimL = Math.floor(Math.random() * lin), minimo = col + lin - 2;
  for (let t = 0; t < 400; t++) {
    const p = [ini], visto = new Set([ini.join()]); let [x, y] = ini;
    while (!(x === col - 1 && y === fimL)) {
      const op = mistura(LADOS).filter(d => { const a = x + d[0], b = y + d[1]; return a >= 0 && b >= 0 && a < col && b < lin && !visto.has(a + "," + b); });
      if (!op.length) break;
      const d = op.find(v => v[0] === 1 && Math.random() < .45) || op[0];
      x += d[0]; y += d[1]; p.push([x, y]); visto.add(x + "," + y);
    }
    if (x === col - 1 && y === fimL && p.length >= Math.max(minimo, 5)) return { p, ini, fimL };
  }
  const p = [ini]; let [x, y] = ini;
  while (x < col - 1) { x++; p.push([x, y]); }
  while (y !== fimL) { y += y < fimL ? 1 : -1; p.push([x, y]); }
  return { p, ini, fimL: y };
}

    let m = 0;
    if (i === 0) m |= 8;

addEventListener("keydown", e => {
  if (!partida) return;
  if (partida.modal) { const n = +e.key; if (n >= 1 && n <= 4) { const b = document.querySelectorAll(".modal .op:not(:disabled)")[n - 1]; if (b) b.click(); } return; }
  if (partida.tecla) partida.tecla(e);
});

/* ---------- RESULTADO ---------- */
function telaResultado(f, pts) {
  const m = maxFase(f), recorde = pts > (J.melhor[f.id] || 0);
  if (recorde) { J.melhor[f.id] = pts; salvar(); }
  enviaPontos();
  const ok = pts >= m * PONTOS_MIN_FASE, prox = FASES[f.id], tudo = FASES.every(passou);
  mostra(barra() + '<section class="modulo"><p class="etiqueta">' + f.titulo + '</p><p class="placar">' + pts + '<span style="font-size:.4em"> / ' + m + '</span></p><p class="grandes" aria-label="' + estrelas(pts, m) + ' de 3 estrelas">' + desenhaEstrelas(estrelas(pts, m)) + "</p>" + escola() + "<p>" + (recorde ? "Novo recorde nesta sala! " : "Seu recorde continua: " + J.melhor[f.id] + " pontos. ") + (ok ? "A sala " + f.sala + " voltou a ter luz." : "Faça pelo menos " + Math.ceil(m * PONTOS_MIN_FASE) + " pontos para acender esta sala. Releia o texto e tente de novo.") + '</p><div class="linha">' + (tudo ? '<button class="bt liga" id="fim" type="button">Ver a escola acesa</button>' : ok && prox ? '<button class="bt liga" id="seg" type="button">Próxima sala</button>' : "") + '<button class="bt" id="rep" type="button">Jogar de novo</button><button class="bt" id="sum" type="button">Quadro de força</button></div></section>');
  ligaBarra(() => telaResultado(f, pts));
  document.getElementById("rep").onclick = () => telaLeitura(f);
  document.getElementById("sum").onclick = telaMapa;
  if (tudo) document.getElementById("fim").onclick = telaFinal;
  else if (ok && prox) document.getElementById("seg").onclick = () => telaLeitura(prox);
}

/* ---------- RANKING: online com a função Netlify, local como reserva ---------- */
function rankLocal(turma) { return guarda.ler("ligaai:rank", []).filter(p => !turma || p.turma === turma); }
function guardaLocal() {
  const l = guarda.ler("ligaai:rank", []).filter(p => !(p.apelido.toLowerCase() === J.apelido.toLowerCase() && p.turma === J.turma));
  l.push({ apelido: J.apelido, turma: J.turma, pontos: total(), nivel: nivelAtual });
  guarda.por("ligaai:rank", l);
}
async function enviaPontos() {
  guardaLocal();
  try { await fetch("/api/ranking", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ apelido: J.apelido, turma: J.turma, pontos: total(), nivel: nivelAtual }) }); } catch {}
}
async function buscaRanking(turma) {
  try {
    const r = await fetch("/api/ranking?turma=" + encodeURIComponent(turma), { cache: "no-store" });
    if (!r.ok) throw 0;
    const d = await r.json();
    if (!Array.isArray(d.jogadores)) throw 0;
    return { online: true, lista: d.jogadores };
  } catch { return { online: false, lista: rankLocal(turma) }; }
}
async function telaRanking(voltar) {
  if (!J.turma) abaRank = "todas";
  mostra(barra() + '<section class="modulo"><div><p class="etiqueta">Equipe de manutenção</p><h2>Ranking</h2></div>' + (J.turma ? '<div class="abas"><button type="button" data-a="turma" aria-pressed="' + (abaRank === "turma") + '">Turma ' + esc(J.turma) + '</button><button type="button" data-a="todas" aria-pressed="' + (abaRank === "todas") + '">Todas as turmas</button></div>' : "") + '<div id="lista"><p class="etiqueta">Carregando…</p></div><div class="linha"><button class="bt" id="v" type="button">Voltar</button></div></section>');
  ligaBarra(voltar);
  document.getElementById("v").onclick = voltar;
  app.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { abaRank = b.dataset.a; telaRanking(voltar); });
  const { online, lista } = await buscaRanking(abaRank === "turma" ? J.turma : "");
  const el = document.getElementById("lista"); if (!el) return;
  const ord = lista.slice().sort((a, b) => b.pontos - a.pontos).slice(0, 20);
  el.innerHTML = (ord.length ? '<ol class="tab">' + ord.map((p, i) => {
    const eu = p.apelido.toLowerCase() === J.apelido.toLowerCase() && p.turma === J.turma;
    return '<li class="' + (eu ? "eu" : "") + '"><span class="pos">' + (i + 1) + 'º</span><span class="nm">' + esc(p.apelido) + (p.turma && abaRank !== "turma" ? " <small>" + esc(p.turma) + "</small>" : "") + (NIVEIS[p.nivel] ? " <small>" + NIVEIS[p.nivel].nome + "</small>" : "") + '</span><span class="pt">' + p.pontos + "</span></li>";
  }).join("") + "</ol>" : "<p>Ninguém pontuou ainda. Termine uma sala para aparecer aqui.</p>") + '<p class="etiqueta" style="margin-top:10px">' + (online ? "Ranking online: atualiza para todos." : "Ranking deste aparelho: mostra só quem jogou aqui.") + "</p>";
}

/* ---------- FINAL ---------- */
function telaFinal() {
  mostra(barra() + '<section class="modulo"><p class="etiqueta">Relatório de manutenção</p><h2 class="logo menor">Escola acesa!</h2><p class="etiqueta">Equipe: ' + esc(J.apelido) + "</p>" + escola() + '<p class="placar">' + total() + '<span style="font-size:.4em"> / ' + PONTOS_TOTAL + '</span></p><div class="leitura"><p>Você caçou defeitos, fechou circuitos, separou materiais, repetiu sinais do corpo e alinhou planetas para religar cada sala.</p><p class="curiosidade"><b>Desafio para a sala maker:</b> com pilha, LED e fita de cobre ou papel-alumínio, monte um circuito de verdade. Faça uma hipótese: o que conduz e o que não conduz? Teste moedas, plástico e lápis. Registre tudo. Use só pilha, nunca a tomada.</p></div><div class="linha"><button class="bt liga" id="r" type="button">Ver ranking</button><button class="bt" id="s" type="button">Quadro de força</button></div></section>');
  ligaBarra(telaFinal);
  document.getElementById("r").onclick = () => telaRanking(telaFinal);
  document.getElementById("s").onclick = telaMapa;
}

telaInicio();
</script>
