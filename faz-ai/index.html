<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faz Aí!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Special+Elite&family=Permanent+Marker&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: páginas de fanzine xerocado, coladas sobre um fundo de capa de disco punk. */
:root {
  color-scheme: light;
  --capa: #FFE500;
  --tinta: #111111;
  --papel: #F4F4EF;
  --xerox: #C9C9C4;
  --rosa: #FF2E88;
  --rosa-texto: #B8004F;
  --verde: #29D17D;
  --cinza-texto: #4A4A46;
  --display: "Bowlby One", Impact, "Arial Black", sans-serif;
  --maquina: "Special Elite", "Courier New", monospace;
  --marcador: "Permanent Marker", "Comic Sans MS", cursive;
  --texto: "Atkinson Hyperlegible", Verdana, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--capa);
  background-image: radial-gradient(rgba(255, 46, 136, .35) 1.6px, transparent 1.7px);
  background-size: 11px 11px;
  color: var(--tinta);
  font: 400 1.0625rem/1.5 var(--texto);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px;
}
#app { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3, p { margin: 0; }
h2 { font: 400 clamp(1.6rem, 5vw, 2.3rem)/1.1 var(--display); text-wrap: balance; }
h3 { font: 400 1.25rem/1.2 var(--display); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--rosa-texto); outline-offset: 2px; }

.folha {
  position: relative;
  background: var(--papel);
  border: 3px solid var(--tinta);
  box-shadow: 7px 7px 0 var(--tinta);
  padding: clamp(18px, 4vw, 32px);
  display: flex; flex-direction: column; gap: 16px;
}
.fita::before {
  content: ""; position: absolute; top: -13px; left: 50%; width: 110px; height: 26px;
  transform: translateX(-50%) rotate(-2.5deg);
  background: rgba(255, 46, 136, .75); border-inline: 2px dashed var(--tinta);
}
.etiqueta { font: 400 .9rem/1.3 var(--maquina); letter-spacing: .04em; color: var(--cinza-texto); }
.rabisco { font: 400 1.2rem/1.25 var(--marcador); color: var(--rosa-texto); transform: rotate(-1.2deg); }

.bt {
  min-height: 50px; padding: 10px 20px;
  border: 3px solid var(--tinta); background: var(--papel);
  font: 400 1.02rem/1.15 var(--display); letter-spacing: .02em;
  box-shadow: 4px 4px 0 var(--tinta);
  transition: transform .08s, box-shadow .08s;
}
.bt:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--tinta); }
.bt:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--tinta); }
.bt:disabled { opacity: .45; cursor: not-allowed; }
.bt.quente { background: var(--rosa); }
.bt.preto { background: var(--tinta); color: var(--papel); box-shadow: 4px 4px 0 var(--rosa); }
.linha { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.linha.fim { justify-content: flex-end; }

/* Título em letras de bilhete recortado */
.recorte { display: flex; flex-wrap: wrap; gap: 5px; line-height: 1; }
.recorte span { display: inline-block; padding: .1em .22em; border: 2px solid var(--tinta); font-size: clamp(2.6rem, 13vw, 5.4rem); animation: colar .35s backwards; }
.recorte.menor span { font-size: clamp(1.5rem, 7vw, 2.8rem); }
.recorte .e { width: .55em; border: 0; padding: 0; }
.l0 { background: var(--tinta); color: var(--capa); font-family: var(--display); transform: rotate(-4deg); }
.l1 { background: var(--papel); font-family: var(--maquina); transform: rotate(3deg); }
.l2 { background: var(--rosa); font-family: var(--marcador); transform: rotate(-2deg); }
.l3 { background: var(--capa); font-family: var(--display); transform: rotate(5deg); }
.l4 { background: var(--xerox); font-family: var(--maquina); transform: rotate(-3deg); }
@keyframes colar { from { transform: scale(1.7) rotate(14deg); opacity: 0; } }

/* Início */
.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; flex: 1 1 200px; }
.campo label { font: 400 1rem/1.2 var(--display); }
.campo input { min-height: 50px; width: 100%; padding: 8px 12px; border: 3px solid var(--tinta); background: #fff; font: 400 1.15rem/1.2 var(--maquina); }
.aviso { border: 2px dashed var(--tinta); padding: 10px 12px; font-size: .95rem; }
.erro { color: var(--rosa-texto); font-weight: 700; min-height: 1.5em; }

/* Barra do jogador */
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--tinta); color: var(--papel); padding: 8px 12px; font: 400 .98rem/1.2 var(--maquina); }
.barra strong { font: 400 1.15rem/1 var(--display); color: var(--capa); font-variant-numeric: tabular-nums; }
.barra .esp { flex: 1; }
.barra button { min-height: 40px; padding: 4px 10px; background: transparent; border: 2px solid var(--papel); color: var(--papel); font: 400 .9rem/1 var(--maquina); }

/* Sumário das fases */
.sumario { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 225px), 1fr)); gap: 18px; }
.pagina { text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 14px; background: var(--papel); border: 3px solid var(--tinta); box-shadow: 5px 5px 0 var(--tinta); min-height: 160px; transition: transform .1s; }
.pagina:nth-child(odd) { transform: rotate(-.8deg); }
.pagina:nth-child(even) { transform: rotate(.7deg); }
.pagina:hover:not(:disabled) { transform: rotate(0) translateY(-3px); }
.pagina:disabled { background: var(--xerox); box-shadow: 5px 5px 0 #6c6c68; cursor: not-allowed; }
.pagina .num { font: 400 1.9rem/1 var(--display); color: var(--rosa-texto); }
.pagina:disabled .num { color: var(--cinza-texto); }
.pagina .tags { font: 400 .82rem/1.25 var(--maquina); color: var(--cinza-texto); }
.pagina .pe { margin-top: auto; display: flex; justify-content: space-between; gap: 8px; font: 400 .95rem/1.2 var(--maquina); }
.estrelas { color: var(--rosa-texto); letter-spacing: .08em; }

/* Página de leitura da fase */
.leitura { display: flex; flex-direction: column; gap: 12px; max-width: 65ch; }
.destaque { background: var(--tinta); color: var(--capa); padding: 2px 6px; }
.curiosidade { border-left: 6px solid var(--rosa); padding: 6px 12px; background: #fff; }

/* Perguntas */
.progresso { display: flex; gap: 4px; }
.progresso i { flex: 1; height: 10px; border: 2px solid var(--tinta); background: #fff; }
.progresso i.ok { background: var(--verde); }
.progresso i.no { background: var(--rosa); }
.progresso i.ag { background: var(--capa); }
.enunciado { font-size: clamp(1.15rem, 3.4vw, 1.4rem); line-height: 1.35; font-weight: 700; text-wrap: pretty; }
.opcoes { display: grid; gap: 10px; }
.opcoes.duas { grid-template-columns: 1fr 1fr; }
.op { min-height: 54px; padding: 10px 14px; text-align: left; background: #fff; border: 3px solid var(--tinta); box-shadow: 3px 3px 0 var(--tinta); line-height: 1.3; }
.op:hover:not(:disabled) { background: var(--capa); }
.op:disabled { cursor: default; color: var(--tinta); }
.op.certa { background: var(--verde); font-weight: 700; }
.op.certa::before { content: "✓ "; }
.op.errada { background: var(--rosa); font-weight: 700; }
.op.errada::before { content: "✗ "; }
.op.apagada { opacity: .5; }
.duas .op { text-align: center; font: 400 1.05rem/1.15 var(--display); }
.cartao { position: relative; }
.cartao.com-carimbo { padding-bottom: 46px; }
.carimbo { position: absolute; right: 2%; bottom: 0; padding: 4px 12px; border: 4px solid currentColor; font: 400 1.5rem/1 var(--display); transform: rotate(-10deg); background: var(--papel); animation: carimbar .22s; pointer-events: none; }
.carimbo.bom { color: #006B3C; }
.carimbo.ruim { color: var(--rosa-texto); }
@keyframes carimbar { from { transform: rotate(-10deg) scale(2.6); opacity: 0; } }
.retorno { border: 3px solid var(--tinta); padding: 12px 14px; background: #fff; display: flex; flex-direction: column; gap: 8px; }
.retorno b { font-family: var(--display); font-weight: 400; }
.tempo { height: 14px; border: 2px solid var(--tinta); background: #fff; }
.tempo div { height: 100%; background: var(--rosa); transition: width .25s linear; }

/* Linha do tempo */
.ordem { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ordem li { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; background: #fff; border: 3px solid var(--tinta); }
.ordem li > div { min-width: 0; }
.ordem li.fixa { background: var(--verde); }
.ordem li.fora { background: #FFD3E5; }
.ordem .ano { font: 400 1.05rem/1.2 var(--display); }
.setas { display: flex; gap: 6px; }
.setas button { width: 46px; height: 46px; border: 3px solid var(--tinta); background: var(--capa); font: 400 1.1rem/1 var(--display); }
.setas button:disabled { opacity: .3; cursor: not-allowed; }

/* Ligar colunas */
.pares { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 10px; }
.pares > div { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.par { flex: 1 0 auto; min-height: 56px; padding: 8px; text-align: left; background: #fff; border: 3px solid var(--tinta); line-height: 1.25; font-size: 1rem; }
.par.ferr { font-family: var(--display); font-size: clamp(.78rem, 3.3vw, .98rem); }
.par[aria-pressed="true"] { background: var(--capa); box-shadow: inset 0 0 0 3px var(--tinta); }
.par.feito { background: var(--verde); }
.par.treme { background: var(--rosa); animation: tremer .3s; }
@keyframes tremer { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* Resultado e ranking */
.placar { font: 400 clamp(2.6rem, 11vw, 4.4rem)/1 var(--display); font-variant-numeric: tabular-nums; }
.grandes { font-size: 2rem; letter-spacing: .1em; color: var(--rosa-texto); }
.abas { display: flex; flex-wrap: wrap; gap: 8px; }
.abas button { min-height: 44px; padding: 6px 12px; background: #fff; border: 3px solid var(--tinta); font: 400 .95rem/1 var(--maquina); }
.abas button[aria-pressed="true"] { background: var(--tinta); color: var(--capa); }
.tab { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.tab li { display: grid; grid-template-columns: 2.3em minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 7px 10px; background: #fff; border: 2px solid var(--tinta); }
.tab li.eu { background: var(--capa); border-width: 3px; }
.tab li:nth-child(1) { background: var(--rosa); }
.tab .pos { font: 400 1.05rem/1 var(--display); }
.tab .nm { overflow-wrap: anywhere; font: 400 1.05rem/1.25 var(--maquina); }
.tab small { color: var(--tinta); font: 400 .8rem/1 var(--maquina); }
.tab .pt { font: 400 1.05rem/1 var(--display); font-variant-numeric: tabular-nums; }


.niveis { margin: 0; padding: 0; border: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 8px; }
.niveis legend { font: 400 1rem/1.2 var(--display); padding: 0 0 5px; }
.nivel { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; background: #fff; border: 3px solid var(--tinta); cursor: pointer; }
.nivel:has(input:checked) { background: var(--capa); }
.nivel input { margin: 3px 0 0; accent-color: var(--tinta); }
.nivel span { display: flex; flex-direction: column; min-width: 0; }
.nivel b { font: 400 1rem/1.2 var(--display); }
.nivel small { font-size: .85rem; line-height: 1.25; }
/* Palco do jogo de plataforma */
.palco { display: flex; flex-direction: column; gap: 12px; }
.tela { width: min(100%, calc((100dvh - 150px) * 16 / 9)); margin-inline: auto; border: 3px solid var(--tinta); box-shadow: 6px 6px 0 var(--tinta); background: var(--papel); line-height: 0; }
.tela canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; touch-action: none; }
.controles { display: none; justify-content: space-between; align-items: center; gap: 12px; touch-action: none; user-select: none; -webkit-user-select: none; }
.ctl { width: 76px; height: 68px; background: var(--papel); border: 3px solid var(--tinta); box-shadow: 3px 3px 0 var(--tinta); font: 400 1.5rem/1 var(--display); touch-action: none; user-select: none; -webkit-user-select: none; }
.ctl:active { background: var(--capa); }
.ctl.pulo { width: 104px; background: var(--rosa); font-size: 1.1rem; }
.modal { position: fixed; inset: 0; z-index: 20; overflow-y: auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); background: rgba(17, 17, 17, .72); }
.modal .folha { max-width: 640px; margin: 0 auto; animation: colar .18s backwards; }
.impressora { width: min(100%, 210px); margin-inline: auto; display: block; }
.impressora .falta * { fill: none; stroke: #8f8f8a; stroke-width: 1.5; stroke-dasharray: 4 3; }
.impressora .ganha * { fill: var(--tinta); stroke: var(--tinta); stroke-width: 1.5; }
.impressora .ganha path:last-child { fill: none; stroke: var(--rosa-texto); stroke-width: 4; }
@media (pointer: coarse) {
  .controles { display: flex; }
  .dica { display: none; }
}
@media (pointer: coarse) and (orientation: landscape) {
  .tela { position: relative; width: min(100%, calc((100dvh - 80px) * 16 / 9)); }
  .controles { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: 10px; z-index: 5; pointer-events: none; }
  .ctl { pointer-events: auto; opacity: .78; }
}
@media (max-width: 460px) {
  .opcoes.duas { grid-template-columns: 1fr; }
  .folha { box-shadow: 5px 5px 0 var(--tinta); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
</style>

    vao(x) { const v = 95 + DIF.vao; chao(x, 120); chao(x + 120 + v, 125); peca(x + 120 + v / 2, CHAO - 72); return 245 + v; },
    pregos(x) { chao(x, 380); L.pregos.push({ x: x + 190 - DIF.pregos / 2, w: DIF.pregos }); peca(x + 190, CHAO - 74); return 380; },
    escada(x) { chao(x, 430); bloco(x + 100, CHAO - 60, 85); bloco(x + 215, CHAO - 115, 85); peca(x + 258, CHAO - 150); return 430; },
    inimigo(x) { chao(x, 440); L.inimigos.push({ x0: x + 130, x1: x + 370, morto: false }); peca(x + 250, CHAO - 28); return 440; },
    prensa(x) { chao(x, 370); L.prensas.push({ x: x + 165, w: 52, y0: CHAO - 190, y1: CHAO - 2 }); peca(x + 300, CHAO - 28); return 370; },
    elevador(x) { chao(x, 90); L.elevadores.push({ x0: x + 98, x1: x + 252, y: CHAO - 4, w: 80 }); chao(x + 340, 100); peca(x + 215, CHAO - 72); return 440; },

      });
      if (f.botoes) m.querySelector("#cartao").insertAdjacentHTML("beforeend", '<span class="carimbo ' + (ok ? "bom" : "ruim") + '">' + (ok ? "ACERTOU" : "ERROU") + "</span>");
      m.querySelector("#r").innerHTML = '<div class="retorno"><p><b>' + (k === -1 ? "O tempo acabou." : ok ? "Peça perfeita! +" + ganho + " pontos." : "Peça com defeito: sem pontos.") + "</b> " + it.p + '</p><div class="linha fim"><button class="bt preto" id="prox" type="button">Continuar correndo</button></div></div>';
      const b = m.querySelector("#prox"); b.focus({ preventScroll: true }); b.scrollIntoView({ block: "nearest" });
      b.onclick = () => { m.remove(); if (document.activeElement) document.activeElement.blur(); P.pausa = false; P.ult = performance.now(); for (const k in teclas) teclas[k] = false; P.jAntes = true; };
    }
    m.querySelectorAll(".op").forEach(b => b.onclick = () => responde(+b.dataset.k));
    if (f.tipo === "tempo") {
      timer = setInterval(() => {
        restante.v -= .25;
        const bt = m.querySelector("#t"); if (bt) bt.style.width = Math.max(0, restante.v / DIF.tempo * 100) + "%";
        if (restante.v <= 0) responde(-1);
      }, 250);
    }
  }
  P.raf = requestAnimationFrame(laco);
}

/* Impressora 3D montada aos poucos: uma parte por fase concluída. */
function impressora() {
  const c = i => passou(FASES[i]) ? "ganha" : "falta";
  return '<svg class="impressora" viewBox="0 0 220 200" role="img" aria-label="Impressora 3D com ' + FASES.filter(passou).length + ' de 6 partes">' +
    '<g class="' + c(0) + '"><rect x="24" y="14" width="10" height="170"/><rect x="186" y="14" width="10" height="170"/><rect x="24" y="14" width="172" height="10"/><rect x="14" y="176" width="192" height="12"/></g>' +
    '<g class="' + c(1) + '"><rect x="34" y="62" width="152" height="6"/><rect x="60" y="24" width="5" height="152"/><rect x="155" y="24" width="5" height="152"/></g>' +
    '<g class="' + c(2) + '"><rect x="52" y="142" width="116" height="10"/></g>' +
    '<g class="' + c(3) + '"><rect x="96" y="54" width="28" height="24"/><path d="M104 78h12l-6 12z"/></g>' +
    '<g class="' + c(4) + '"><circle cx="110" cy="8" r="0"/><path d="M198 40a14 14 0 1 0 .1 0zM110 54c0-18 40-26 76-16" /></g>' +
    '<g class="' + c(5) + '"><rect x="130" y="162" width="46" height="12"/></g></svg>';
}

/* ---------- RESULTADO ---------- */
function telaResultado(f, pts) {
  const m = maxFase(f), recorde = pts > (J.melhor[f.id] || 0);
  if (recorde) { J.melhor[f.id] = pts; salvar(); }
  enviaPontos();
  const ok = pts >= m * PONTOS_MIN_FASE, prox = FASES[f.id], tudo = FASES.every(passou);
  mostra(barra() + '<section class="folha fita"><p class="etiqueta">Fase ' + f.id + " · " + f.titulo + '</p><p class="placar">' + pts + '<span style="font-size:.4em"> / ' + m + '</span></p>' +
    '<p class="grandes" aria-label="' + estrelas(pts, m) + ' de 3 estrelas">' + desenhaEstrelas(estrelas(pts, m)) + '</p>' +
    '<p class="rabisco">' + (recorde ? "Novo recorde nesta fase!" : "Seu recorde continua: " + J.melhor[f.id] + " pontos.") + '</p>' +
    "<p>" + (ok ? "Fase concluída! Você ganhou esta parte da impressora: <b>" + PECAS_IMPRESSORA[f.id - 1] + "</b>. Repita quando quiser para buscar 3 estrelas." : "Você precisa de pelo menos " + Math.ceil(m * PONTOS_MIN_FASE) + " pontos para abrir a próxima fase. Releia a página e tente de novo.") + '</p>' +
    '<div class="linha">' +
    (tudo ? '<button class="bt quente" id="fim" type="button">Ver minha capa final</button>' : (ok && prox ? '<button class="bt quente" id="seg" type="button">Próxima fase</button>' : "")) +
    '<button class="bt" id="rep" type="button">Jogar de novo</button><button class="bt" id="sum" type="button">Sumário</button></div></section>');
  ligaBarra(() => telaResultado(f, pts));
  document.getElementById("rep").onclick = () => telaLeitura(f);
  document.getElementById("sum").onclick = telaMapa;
  if (tudo) document.getElementById("fim").onclick = telaFinal;
  else if (ok && prox) document.getElementById("seg").onclick = () => telaLeitura(prox);
}

/* ---------- RANKING: online com a função Netlify, local como reserva ---------- */
function rankLocal(turma) {
  const l = guarda.ler("fazai2:rank", []);
  return l.filter(p => !turma || p.turma === turma);
}
function guardaLocal() {
  const l = guarda.ler("fazai2:rank", []).filter(p => !(p.apelido.toLowerCase() === J.apelido.toLowerCase() && p.turma === J.turma));
  l.push({ apelido: J.apelido, turma: J.turma, pontos: total(), nivel: nivelAtual });
  guarda.por("fazai2:rank", l);
}
async function enviaPontos() {
  guardaLocal();
  try {
    await fetch("/api/ranking", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ apelido: J.apelido, turma: J.turma, pontos: total(), nivel: nivelAtual }) });
  } catch {}
}
async function buscaRanking(turma) {
  try {
    const r = await fetch("/api/ranking?turma=" + encodeURIComponent(turma), { cache: "no-store" });
    if (!r.ok) throw 0;
    const d = await r.json();
    if (!Array.isArray(d.jogadores)) throw 0;
    return { online: true, lista: d.jogadores };
  } catch {
    return { online: false, lista: rankLocal(turma) };
  }
}
async function telaRanking(voltar) {
  const temTurma = !!J.turma;
  if (!temTurma) abaRank = "todas";
  mostra(barra() + '<section class="folha fita"><div><p class="etiqueta">Quadro de honra</p><h2>Ranking</h2></div>' +
    (temTurma ? '<div class="abas"><button type="button" data-a="turma" aria-pressed="' + (abaRank === "turma") + '">Turma ' + esc(J.turma) + '</button><button type="button" data-a="todas" aria-pressed="' + (abaRank === "todas") + '">Todas as turmas</button></div>' : "") +
    '<div id="lista"><p class="etiqueta">Carregando…</p></div><div class="linha"><button class="bt" id="v" type="button">Voltar</button></div></section>');
  ligaBarra(voltar);
  document.getElementById("v").onclick = voltar;
  app.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { abaRank = b.dataset.a; telaRanking(voltar); });
  const { online, lista } = await buscaRanking(abaRank === "turma" ? J.turma : "");
  const el = document.getElementById("lista"); if (!el) return;
  const ord = lista.slice().sort((a, b) => b.pontos - a.pontos).slice(0, 20);
  el.innerHTML = (ord.length ? '<ol class="tab">' + ord.map((p, i) => {
    const eu = p.apelido.toLowerCase() === J.apelido.toLowerCase() && p.turma === J.turma;
    return '<li class="' + (eu ? "eu" : "") + '"><span class="pos">' + (i + 1) + 'º</span><span class="nm">' + esc(p.apelido) + (p.turma && abaRank !== "turma" ? " <small>" + esc(p.turma) + "</small>" : "") + (DIFICULDADES[p.nivel] ? " <small>" + DIFICULDADES[p.nivel].nome + "</small>" : "") + '</span><span class="pt">' + p.pontos + "</span></li>";
  }).join("") + "</ol>" : "<p>Ninguém pontuou ainda. Termine uma fase para aparecer aqui.</p>") +
    '<p class="etiqueta" style="margin-top:10px">' + (online ? "Ranking online: atualiza para todos." : "Ranking deste aparelho: mostra só quem jogou aqui.") + "</p>";
}

/* ---------- CAPA FINAL ---------- */
function telaFinal() {
  const ptsTotal = total();
  mostra(barra() + '<section class="folha fita"><p class="etiqueta">Fanzine Faz Aí! · Edição nº 1 · Capa de</p>' + recorte(J.apelido.toUpperCase(), true) +
    '<p class="placar">' + ptsTotal + '<span style="font-size:.4em"> / ' + PONTOS_TOTAL + '</span></p>' +
    impressora() + '<p class="rabisco">Impressora montada! Agora é sua vez de fazer.</p>' +
    '<div class="leitura"><p>Você viu que a cultura maker juntou o “faça você mesmo” do punk, os clubes de computador, os Fab Labs, a revista Make: e a ideia de aprender construindo.</p>' +
    '<p class="curiosidade"><b>Desafio para a sala maker:</b> crie um fanzine de uma folha contando um problema da sua escola e uma ideia para resolver. Use recorte, colagem e xerox, como em 1977.</p></div>' +
    '<div class="linha"><button class="bt quente" id="r" type="button">Ver ranking</button><button class="bt" id="s" type="button">Sumário</button></div></section>');
  ligaBarra(telaFinal);
  document.getElementById("r").onclick = () => telaRanking(telaFinal);
  document.getElementById("s").onclick = telaMapa;
}

telaInicio();
</script>
