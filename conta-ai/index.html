<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conta Aí!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: brinquedo impresso em plástico colorido, com faixas de camadas no fundo e cantos arredondados. */
:root {
  color-scheme: light;
  --roxo: #4B2FC9;
  --roxo-faixa: #4327B8;
  --tinta: #251A54;
  --suave: #5C5385;
  --branco: #FFFFFF;
  --gelo: #F1EEFF;
  --laranja: #FF8A1F;
  --laranja-b: #C95F00;
  --amarelo: #FFD21F;
  --turquesa: #12C4B0;
  --turquesa-b: #0A8A7C;
  --rosa: #FF4D8D;
  --verde: #2BD66F;
  --vermelho: #F0435A;
  --display: "Lilita One", Impact, sans-serif;
  --texto: "Nunito", "Trebuchet MS", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: repeating-linear-gradient(0deg, var(--roxo) 0 16px, var(--roxo-faixa) 16px 32px);
  color: var(--tinta);
  font: 600 1.06rem/1.5 var(--texto);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px;
}
#app { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3, p { margin: 0; }
h2 { font: 400 clamp(1.7rem, 5vw, 2.4rem)/1.1 var(--display); text-wrap: balance; }
h3 { font: 400 1.2rem/1.15 var(--display); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 4px solid var(--amarelo); outline-offset: 2px; }

.folha { background: var(--branco); border-radius: 26px; padding: clamp(18px, 4vw, 30px); display: flex; flex-direction: column; gap: 16px; box-shadow: 0 9px 0 rgba(20, 8, 80, .45); min-width: 0; }
.etiqueta { font: 700 .88rem/1.35 var(--texto); color: var(--suave); }
.rabisco { font: 800 1.12rem/1.3 var(--texto); color: var(--roxo); }

.bt { min-height: 50px; padding: 10px 22px; border: 0; border-radius: 999px; background: var(--gelo); box-shadow: 0 5px 0 #C9C1EE; font: 400 1.05rem/1.1 var(--display); letter-spacing: .02em; transition: transform .07s, box-shadow .07s; }
.bt:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 0 #C9C1EE; }
.bt:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #C9C1EE; }
.bt.quente { background: var(--laranja); box-shadow: 0 5px 0 var(--laranja-b); color: var(--tinta); }
.bt.quente:hover:not(:disabled) { box-shadow: 0 6px 0 var(--laranja-b); }
.bt.quente:active:not(:disabled) { box-shadow: 0 1px 0 var(--laranja-b); }
.bt.preto { background: var(--turquesa); box-shadow: 0 5px 0 var(--turquesa-b); color: var(--tinta); }
.bt.preto:hover:not(:disabled) { box-shadow: 0 6px 0 var(--turquesa-b); }
.bt.preto:active:not(:disabled) { box-shadow: 0 1px 0 var(--turquesa-b); }
.bt.grande { min-height: 72px; font-size: 1.35rem; touch-action: none; user-select: none; -webkit-user-select: none; }
.linha { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.linha.fim { justify-content: flex-end; }

/* Título extrudado, como letras impressas em camadas */
.logo { font: 400 clamp(3rem, 11vw, 5.2rem)/.95 var(--display); color: var(--amarelo); letter-spacing: .01em; overflow-wrap: anywhere;
  text-shadow: 0 2px 0 var(--laranja), 0 4px 0 var(--laranja), 0 6px 0 var(--rosa), 0 8px 0 var(--rosa), 0 10px 0 var(--roxo), 0 12px 0 var(--roxo); padding-bottom: 12px; }
.logo.menor { font-size: clamp(1.7rem, 7vw, 3rem); }
.inicio { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; align-items: stretch; }
.demo { border-radius: 26px; overflow: hidden; box-shadow: 0 9px 0 rgba(20, 8, 80, .45); min-height: 240px; background: #FFE1C2; line-height: 0; }
.demo canvas { width: 100%; height: 100%; display: block; }

.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; flex: 1 1 170px; }
.campo label { font: 400 1rem/1.2 var(--display); }
.campo input { min-height: 50px; width: 100%; padding: 8px 16px; border: 3px solid var(--gelo); border-radius: 16px; background: var(--gelo); font: 700 1.1rem/1.2 var(--texto); }
.campo input:focus { border-color: var(--roxo); }
.campo input::placeholder { color: var(--suave); }
.aviso { background: var(--gelo); border-radius: 16px; padding: 10px 14px; font-size: .93rem; font-weight: 600; }
.erro { color: #B91C35; font-weight: 800; min-height: 1.5em; }
.niveis { margin: 0; padding: 0; border: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 120px), 1fr)); gap: 8px; }
.niveis legend { font: 400 1rem/1.2 var(--display); padding: 0 0 5px; }
.nivel { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; background: var(--gelo); border-radius: 16px; border: 3px solid transparent; cursor: pointer; }
.nivel:has(input:checked) { border-color: var(--roxo); background: #E4DEFF; }
.nivel input { margin: 4px 0 0; accent-color: var(--roxo); }
.nivel span { display: flex; flex-direction: column; min-width: 0; }
.nivel b { font: 400 1rem/1.2 var(--display); }
.nivel small { font-size: .8rem; line-height: 1.2; }

.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; color: var(--branco); padding: 2px 4px; font: 800 .95rem/1.2 var(--texto); }
.barra strong { font: 400 1.25rem/1 var(--display); color: var(--amarelo); font-variant-numeric: tabular-nums; }
.barra .esp { flex: 1; }
.barra button { min-height: 40px; padding: 4px 14px; background: rgba(255, 255, 255, .16); border: 0; border-radius: 999px; color: var(--branco); font: 800 .88rem/1 var(--texto); }

/* Fila de impressão */
.sumario { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.pagina { text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; border: 0; border-radius: 20px; background: #FFE1C2; box-shadow: 0 5px 0 #E0741A; transition: transform .08s; }
.pagina:nth-child(2) { background: #CFF6EE; box-shadow: 0 5px 0 #0E9C8C; }
.pagina:nth-child(3) { background: #FFD6E5; box-shadow: 0 5px 0 #D93A75; }
.pagina:nth-child(4) { background: #FFF2B8; box-shadow: 0 5px 0 #D9A400; }
.pagina:nth-child(5) { background: #D8DBFF; box-shadow: 0 5px 0 #4D50D6; }
.pagina:nth-child(6) { background: #D5F5D6; box-shadow: 0 5px 0 #1FA245; }
.pagina:hover:not(:disabled) { transform: translateY(-3px); }
.pagina:disabled { background: #E7E5F0; box-shadow: 0 5px 0 #B9B6CC; color: var(--suave); cursor: not-allowed; }
.pagina .num { font: 400 1.6rem/1 var(--display); opacity: .75; }
.pagina .tags { font: 700 .8rem/1.3 var(--texto); }
.pagina .pe { margin-top: 6px; display: flex; justify-content: space-between; gap: 8px; font: 800 .92rem/1.2 var(--texto); }
.estrelas { color: var(--tinta); letter-spacing: .08em; }

.leitura { display: flex; flex-direction: column; gap: 12px; max-width: 68ch; }
.destaque { background: var(--amarelo); padding: 0 6px; border-radius: 6px; font-weight: 800; }
.curiosidade { background: #CFF6EE; border-radius: 16px; padding: 10px 14px; }

.enunciado { font: 800 clamp(1.15rem, 3.4vw, 1.38rem)/1.35 var(--texto); text-wrap: pretty; }
.opcoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 10px; }
.op { min-height: 54px; padding: 10px 16px; text-align: left; background: var(--gelo); border: 3px solid transparent; border-radius: 16px; font-weight: 800; line-height: 1.25; }
.op:hover:not(:disabled) { border-color: var(--roxo); }
.op:disabled { cursor: default; color: var(--tinta); }
.op.certa { background: var(--verde); }
.op.certa::before { content: "✓ "; }
.op.errada { background: var(--vermelho); color: #fff; }
.op.errada::before { content: "✗ "; }
.op.apagada { opacity: .45; }
.retorno { background: var(--gelo); border-radius: 18px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.retorno b { font-weight: 900; }
.tempo { height: 12px; border-radius: 999px; background: var(--gelo); overflow: hidden; }
.tempo div { height: 100%; background: var(--rosa); transition: width .25s linear; }

.placar { font: 400 clamp(3rem, 11vw, 4.6rem)/1 var(--display); color: var(--roxo); font-variant-numeric: tabular-nums; }
.grandes { font-size: 2rem; letter-spacing: .1em; color: var(--laranja-b); }
.abas { display: flex; flex-wrap: wrap; gap: 8px; }
.abas button { min-height: 44px; padding: 6px 16px; background: var(--gelo); border: 0; border-radius: 999px; font: 800 .92rem/1 var(--texto); }
.abas button[aria-pressed="true"] { background: var(--roxo); color: var(--branco); }
.tab { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.tab li { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 9px 14px; background: var(--gelo); border-radius: 14px; }
.tab li:nth-child(1) { background: var(--amarelo); }
.tab li.eu { outline: 3px solid var(--roxo); }
.tab .pos { font: 400 1.1rem/1 var(--display); }
.tab .nm { overflow-wrap: anywhere; font-weight: 800; }
.tab small { font: 700 .76rem/1 var(--texto); color: var(--suave); }
.tab .pt { font: 400 1.1rem/1 var(--display); font-variant-numeric: tabular-nums; }

.fig { display: block; width: min(100%, 250px); margin: 2px auto 0; }
.fig rect, .fig path, .fig circle { fill: #FFD9B3; stroke: var(--tinta); stroke-width: 2.5; }
.fig .tr { fill: none; stroke: var(--roxo); stroke-dasharray: 6 5; }
.fig .furo { fill: var(--branco); }
.fig text { font: 800 13px var(--texto); fill: var(--tinta); }

/* Prateleira */
.impressora { width: 100%; display: block; }
.impressora .tabua { fill: #8A5A2B; }
.impressora .vaga { fill: var(--gelo); stroke: #C9C1EE; stroke-width: 2; stroke-dasharray: 4 4; }
.impressora text { font: 400 16px var(--display); fill: #A79FD0; }

/* Estação de impressão */
.estacao { display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, 300px); gap: 14px; align-items: start; }
.tela { border-radius: 26px; overflow: hidden; box-shadow: 0 9px 0 rgba(20, 8, 80, .45); line-height: 0; width: min(100%, calc((100dvh - 90px) * .8)); margin-inline: auto; }
.tela canvas { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; touch-action: none; cursor: pointer; }
.painel { background: var(--branco); border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 9px 0 rgba(20, 8, 80, .45); }
.dados { margin: 0; display: flex; flex-direction: column; gap: 7px; }
.dados div { display: flex; flex-direction: column; }
.dados dt { font: 700 .78rem/1.2 var(--texto); color: var(--suave); }
.dados dd { margin: 0; font: 400 1.18rem/1.2 var(--display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.carga { height: 14px; border-radius: 999px; background: var(--gelo); overflow: hidden; }
.carga i { display: block; height: 100%; background: var(--turquesa); border-radius: 999px; transition: width .2s; }
.modal { position: fixed; inset: 0; z-index: 20; overflow-y: auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); background: rgba(37, 26, 84, .72); }
.modal .folha { max-width: 640px; margin: 0 auto; animation: pula .2s; }
@keyframes pula { from { transform: scale(.92); opacity: 0; } }
@media (max-width: 760px) {
  .inicio { grid-template-columns: minmax(0, 1fr); }
  .demo { min-height: 0; height: 210px; }
  .estacao { grid-template-columns: minmax(0, 1fr); }
  .tela { width: min(100%, calc((100dvh - 390px) * .8), 460px); }
  .tela canvas { aspect-ratio: 4 / 5; }
  .painel { padding: 12px 14px; gap: 8px; }
  .dados { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .dados dd { font-size: 1rem; }
  .dica { display: none; }
  .painel #sair { order: 5; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
"use strict";
/* ---------- GERADORES DE QUESTÕES: os números mudam a cada partida ---------- */
const sorteia = (a, b, passo = 1) => a + passo * Math.floor(Math.random() * (Math.floor((b - a) / passo) + 1));
const de = lista => lista[Math.floor(Math.random() * lista.length)];
const num = n => n.toLocaleString("pt-BR");
/* A primeira opção é sempre a certa; o jogo embaralha na hora de mostrar. Os erros vêm de enganos comuns. */
function opcoes(certa, erros, un = "") {
  const vistos = new Set([certa]), lista = [certa];
  const serve = e => Number.isFinite(e) && e > 0 && (Number.isInteger(certa) ? Number.isInteger(e) : Number.isInteger(e * 100));
  for (const e of erros) if (serve(e) && !vistos.has(e) && lista.length < 4) { vistos.add(e); lista.push(e); }
  for (let k = 1; lista.length < 4; k++) { const e = certa + k * Math.max(1, Math.round(certa / 10)); if (!vistos.has(e)) { vistos.add(e); lista.push(e); } }
  return lista.map(n => num(n) + (un ? " " + un : ""));
}
const Q = (q, certa, erros, un, p, d, fig) => ({ q, o: opcoes(certa, erros, un), a: 0, p, d, fig });
const svg = (w, h, miolo) => '<svg class="fig" viewBox="-18 0 ' + (w + 18) + " " + h + '" role="img" aria-label="Figura com as medidas do enunciado, fora de escala">' + miolo + '</svg><p class="etiqueta" style="text-align:center">Figura fora de escala</p>';
const rot = (x, y, t) => '<text x="' + x + '" y="' + y + '" text-anchor="middle">' + t + "</text>";
const figRet = (b, h, u = "cm") => svg(220, 130, '<rect x="40" y="15" width="150" height="85"/>' + rot(115, 122, b + " " + u) + rot(18, 62, h + " " + u));
const figTri = (b, h, u = "cm") => svg(220, 130, '<path d="M30 100H190L90 15Z"/><path class="tr" d="M90 15V100"/>' + rot(110, 122, b + " " + u) + rot(112, 66, h + " " + u));
const figCirc = (t, v, u = "cm") => svg(220, 130, '<circle cx="110" cy="62" r="50"/><path class="tr" d="' + (t === "d" ? "M60 62H160" : "M110 62H160") + '"/>' + rot(t === "d" ? 110 : 135, 55, v + " " + u));
const figL = (a, b, c, d) => svg(220, 130, '<path d="M30 15H110V60H190V105H30Z"/>' + rot(70, 12, c + " cm") + rot(110, 122, a + " cm") + rot(203, 86, d + " cm") + rot(6, 62, b + " cm"));
const figFuro = (b, h, s) => svg(220, 130, '<rect x="30" y="15" width="160" height="85"/><rect class="furo" x="90" y="38" width="40" height="40"/>' + rot(110, 122, b + " cm") + rot(6, 62, h + " cm") + rot(110, 62, s + " cm"));
const figCaixa = (a, b, c) => svg(220, 140, '<path d="M30 50H140V120H30Z"/><path d="M30 50L70 20H180L140 50Z"/><path d="M140 50L180 20V90L140 120Z"/>' + rot(85, 136, a + " cm") + rot(190, 118, b + " cm") + rot(6, 90, c + " cm"));

const ger = {
  areaMesa() { const b = sorteia(15, 30), h = sorteia(10, 25); return Q("A mesa de uma impressora 3D é retangular, com " + b + " cm de comprimento e " + h + " cm de largura. Qual é a área dela?", b * h, [2 * (b + h), b + h, b * h * 2], "cm²", b + " × " + h + " = " + (b * h) + " cm². Área é comprimento vezes largura. Somar os lados dá o perímetro.", "Área do retângulo = comprimento × largura.", figRet(b, h)); },
  areaQuadrado() { const s = sorteia(8, 25); return Q("Uma placa quadrada de MDF tem " + s + " cm de lado. Qual é a área?", s * s, [4 * s, 2 * s, s * s + s], "cm²", s + " × " + s + " = " + (s * s) + " cm². No quadrado, a base e a altura têm a mesma medida.", "Multiplique o lado por ele mesmo."); },
  ladoFaltando() { const b = sorteia(6, 20), h = sorteia(5, 15), A = b * h; return Q("Uma peça retangular tem área de " + A + " cm² e comprimento de " + b + " cm. Qual é a largura?", h, [A - b, b, h + 2], "cm", b + " × ? = " + A + ". Fazendo a conta inversa: " + A + " ÷ " + b + " = " + h + " cm.", "Pense: " + b + " vezes quanto dá " + A + "? Largura = área ÷ comprimento.", figRet(b, "?")); },
  pecasNaMesa() { const p = de([2, 4, 5]), q = de([3, 5, 6]), m = sorteia(3, 6), n = sorteia(3, 6), b = p * m, h = q * n; return Q("Quantas peças retangulares de " + p + " cm por " + q + " cm cabem lado a lado em uma mesa de " + b + " cm por " + h + " cm?", m * n, [m + n, b * h, m * n + m], "peças", "Cabem " + m + " no comprimento e " + n + " na largura: " + m + " × " + n + " = " + (m * n) + " peças.", "Veja quantas cabem em cada direção e multiplique."); },
  converteArea() { const c = sorteia(3, 40); return Q("A base de uma peça tem " + c + " cm². Quanto é isso em mm²?", c * 100, [c * 10, c * 1000, c + 100], "mm²", "1 cm² é um quadrado de 10 mm por 10 mm, ou seja, 100 mm². Então " + c + " × 100 = " + (c * 100) + " mm².", "1 cm² = 10 mm × 10 mm."); },
  custoAdesivo() { const b = sorteia(2, 5) * 10, h = sorteia(2, 4) * 10, pr = sorteia(2, 5), A = b * h; return Q("Cobrir a mesa com adesivo custa R$ " + pr + " a cada 100 cm². Qual é o custo para uma mesa de " + b + " cm por " + h + " cm?", A / 100 * pr, [A * pr, A / 100, A / 100 * pr + pr], "reais", "Área: " + A + " cm². São " + (A / 100) + " blocos de 100 cm². " + (A / 100) + " × " + pr + " = " + (A / 100 * pr) + " reais.", "Calcule a área e veja quantos blocos de 100 cm² ela tem.", figRet(b, h)); },
  triangulo() { const b = sorteia(3, 12) * 2, h = sorteia(4, 15); return Q("Uma peça triangular tem " + b + " cm de base e " + h + " cm de altura. Qual é a área dela?", b * h / 2, [b * h, b + h, b * h / 2 + b], "cm²", "(" + b + " × " + h + ") ÷ 2 = " + (b * h / 2) + " cm². O triângulo ocupa metade do retângulo de mesma base e altura.", "Área do triângulo = base × altura ÷ 2. A altura é a linha tracejada, da base até a ponta.", figTri(b, h)); },
  trianguloInverso() { const b = sorteia(3, 10) * 2, h = sorteia(4, 12), A = b * h / 2; return Q("Um triângulo tem área de " + A + " cm² e base de " + b + " cm. Qual é a altura dele?", h, [A / b, A - b, h * 2], "cm", A + " × 2 = " + (2 * A) + ". Depois " + (2 * A) + " ÷ " + b + " = " + h + " cm.", "Dobre a área e divida pela base.", figTri(b, "?")); },
  circuloRaio() { const r = sorteia(2, 12); return Q("Uma engrenagem circular tem raio de " + r + " cm. Usando π = 3, qual é a área?", 3 * r * r, [2 * 3 * r, 3 * r, 3 * 2 * r * 2 * r], "cm²", "3 × " + r + " × " + r + " = " + (3 * r * r) + " cm².", "Área do círculo = π × raio × raio.", figCirc("r", r)); },
  circuloDiametro() { const r = sorteia(2, 10), d = 2 * r; return Q("Uma tampa circular tem diâmetro de " + d + " cm. Usando π = 3, qual é a área?", 3 * r * r, [3 * d * d, 3 * d, 3 * r], "cm²", "O raio é metade do diâmetro: " + r + " cm. Então 3 × " + r + " × " + r + " = " + (3 * r * r) + " cm².", "Primeiro divida o diâmetro por 2 para achar o raio.", figCirc("d", d)); },
  formaL() { const c = sorteia(4, 8), d = sorteia(3, 6), e = sorteia(3, 6), a = c + e, b = d + sorteia(3, 6); return Q("Esta peça tem formato de L. Divida em dois retângulos, um em cima e outro embaixo. A figura mostra as medidas. Qual é a área total?", c * (b - d) + a * d, [a * b, 2 * (a + b), c * b + a * d], "cm²", "Retângulo de baixo: " + a + " × " + d + " = " + (a * d) + ". Retângulo de cima: " + c + " × " + (b - d) + " = " + (c * (b - d)) + ", porque " + b + " − " + d + " = " + (b - d) + ". Somando: " + (c * (b - d) + a * d) + " cm².", "O lado esquerdo mede a peça inteira. Tire o lado do retângulo de baixo para saber o lado do de cima.", figL(a, b, c, d)); },
  furo() { const b = sorteia(10, 20), h = sorteia(8, 14), s = sorteia(2, 5); return Q("Uma chapa de " + b + " cm por " + h + " cm tem um furo quadrado de " + s + " cm de lado no meio. Qual é a área que sobra?", b * h - s * s, [b * h, b * h + s * s, b * h - s], "cm²", b + " × " + h + " = " + (b * h) + ". O furo tem " + s + " × " + s + " = " + (s * s) + " cm². " + (b * h) + " − " + (s * s) + " = " + (b * h - s * s) + " cm².", "Calcule a chapa inteira e tire a área do furo.", figFuro(b, h, s)); },
  cubo() { const s = sorteia(2, 10); return Q("Um cubo impresso em 3D tem " + s + " cm de aresta. Qual é o volume?", s * s * s, [s * s, 3 * s, 6 * s * s], "cm³", s + " × " + s + " × " + s + " = " + (s * s * s) + " cm³.", "Volume do cubo = aresta × aresta × aresta."); },
  caixa() { const a = sorteia(4, 12), b = sorteia(3, 8), c = sorteia(2, 7); return Q("Uma caixa tem " + a + " cm de comprimento, " + b + " cm de largura e " + c + " cm de altura. Qual é o volume?", a * b * c, [a + b + c, a * b, 2 * (a * b + a * c + b * c)], "cm³", a + " × " + b + " × " + c + " = " + (a * b * c) + " cm³.", "Volume = comprimento × largura × altura.", figCaixa(a, b, c)); },
  mlEmL() { const l = sorteia(2, 9), c = de([250, 500]); const n = l * 1000 / c; return Q("Um recipiente tem " + l + " litros de resina. Quantos potes de " + c + " mL dá para encher?", n, [l * c, l * 10, n / 2], "potes", l + " L = " + (l * 1000) + " mL. " + (l * 1000) + " ÷ " + c + " = " + n + " potes.", "1 litro = 1.000 mL."); },
  cmParaMl() { const a = sorteia(2, 10), b = sorteia(2, 5), c = sorteia(2, 5), V = a * b * c; return Q("Um molde tem " + a + " cm por " + b + " cm por " + c + " cm. Quantos mL de resina enchem esse molde?", V, [V * 10, V * 1000, a + b + c], "mL", "Volume: " + V + " cm³. Como 1 cm³ = 1 mL, são " + V + " mL.", "1 cm³ de volume corresponde a 1 mL de capacidade."); },
  caixaLitros() { const a = de([10, 20, 30]), b = de([10, 20, 50]), c = de([10, 20, 30]), V = a * b * c; return Q("Uma caixa de armazenamento tem " + a + " cm por " + b + " cm por " + c + " cm. Qual é a capacidade em litros?", V / 1000, [V / 100, V / 10, V], "L", "Volume: " + num(V) + " cm³. Como 1.000 cm³ = 1 L, são " + num(V / 1000) + " L.", "Calcule o volume e divida por 1.000."); },
  alturaPote() {
    if (Math.random() < .5) { const a = de([4, 5, 6, 8, 10]), b = de([3, 4, 5]), c = sorteia(2, 9), V = a * b * c; return Q("Um pote retangular tem base de " + a + " cm por " + b + " cm e nele cabem " + V + " mL. Qual é a altura do pote?", c, [V - a * b, a * b, c + 3], "cm", "1 mL = 1 cm³, então o volume é " + V + " cm³. Área da base: " + a + " × " + b + " = " + (a * b) + " cm². " + V + " ÷ " + (a * b) + " = " + c + " cm.", "Altura = volume ÷ área da base."); }
    const r = sorteia(2, 6), c = sorteia(2, 9), A = 3 * r * r, V = A * c;
    return Q("Um pote redondo tem base com raio de " + r + " cm e nele cabem " + V + " mL. Usando π = 3, qual é a altura do pote?", c, [V - A, A, c + 3], "cm", "1 mL = 1 cm³, então o volume é " + V + " cm³. Área da base: 3 × " + r + " × " + r + " = " + A + " cm². " + V + " ÷ " + A + " = " + c + " cm.", "Calcule a área da base com π × raio × raio. Depois: altura = volume ÷ área da base.");
  },
  massa() { const V = sorteia(1, 12) * 4; return Q("Cada 1 cm³ do plástico da impressora pesa cerca de 1,25 g. Quanto pesa uma peça maciça de " + V + " cm³?", V * 5 / 4, [V, V * 2, V + 1], "g", V + " × 1,25 = " + num(V * 5 / 4) + " g.", "Multiplique o volume pelo peso de cada 1 cm³."); },
  rolo() { const p = de([20, 25, 40, 50, 100]); return Q("Um rolo tem 1 kg de filamento. Quantas peças de " + p + " g dá para imprimir?", 1000 / p, [100 / p, p * 10, 1000 / p + 5], "peças", "1 kg = 1.000 g. 1.000 ÷ " + p + " = " + (1000 / p) + " peças, sem contar as perdas.", "Converta 1 kg para gramas."); },
  preenchimento() { const V = sorteia(2, 9) * 50, pc = de([10, 20, 40]); return Q("O espaço interno de uma peça é de " + V + " cm³. A impressora vai encher só " + pc + "% desse espaço com plástico e deixar o resto vazio. Quantos cm³ de plástico serão usados?", V * pc / 100, [V - V * pc / 100, pc, V * pc / 10], "cm³", pc + "% de " + V + " = " + (pc / 100).toLocaleString("pt-BR") + " × " + V + " = " + (V * pc / 100) + " cm³. Encher menos economiza plástico e tempo.", "Porcentagem: divida por 100 e multiplique pelo valor."); },
  custoPeca() { const kg = de([100, 120, 150, 200]), g = de([50, 100, 200, 250]); return Q("Um rolo de 1 kg custa R$ " + kg + ". Qual é o custo do filamento de uma peça de " + g + " g?", kg * g / 1000, [kg * g / 100, kg / g, kg - g / 10], "reais", g + " g é " + (g / 1000).toLocaleString("pt-BR") + " kg. " + kg + " × " + (g / 1000).toLocaleString("pt-BR") + " = " + num(kg * g / 1000) + " reais.", "Divida o preço por 1.000 para achar o custo de 1 g."); },
  camadas() { const h = sorteia(2, 12) * 10; return Q("Uma peça tem " + h + " mm de altura e a impressora faz camadas de 0,2 mm. Quantas camadas serão impressas?", h * 5, [h * 2, h, h * 50], "camadas", h + " ÷ 0,2 = " + (h * 5) + " camadas. Camadas mais finas dão mais acabamento, mas levam mais tempo.", "Divida a altura pela espessura da camada."); },
  tempoImpressao() { const v = de([8, 10, 12, 15]), t = sorteia(2, 8); return Q("Uma impressora usa " + v + " cm³ de plástico por hora. Quantas horas leva uma peça de " + (v * t) + " cm³?", t, [v * t - v, v, t + 4], "horas", (v * t) + " ÷ " + v + " = " + t + " horas.", "Tempo = volume ÷ velocidade."); },
  somaSimples() { const x = sorteia(3, 30), a = sorteia(2, 25); return Q("Resolva: x + " + a + " = " + (x + a), x, [x + 2 * a, a, x + 1], "", "Tire " + a + " dos dois lados: x = " + (x + a) + " − " + a + " = " + x + ".", "Faça a operação inversa da soma."); },
  multSimples() { const x = sorteia(3, 15), a = sorteia(2, 9); return Q("Resolva: " + a + "x = " + (a * x), x, [a * x - a, a * x, x + a], "", "Divida os dois lados por " + a + ": x = " + (a * x) + " ÷ " + a + " = " + x + ".", a + "x significa " + a + " vezes x."); },
  doisPassos() { const x = sorteia(2, 12), a = sorteia(2, 8), b = sorteia(1, 20); return Q("Resolva: " + a + "x + " + b + " = " + (a * x + b), x, [(a * x + 2 * b) / a, a * x, x + 2], "", "Primeiro tire " + b + ": " + a + "x = " + (a * x) + ". Depois divida por " + a + ": x = " + x + ".", "Tire primeiro o número somado, depois divida."); },
  doisPassosMenos() { const x = sorteia(3, 12), a = sorteia(2, 7), b = sorteia(1, Math.min(15, a * x - 1)); return Q("Resolva: " + a + "x − " + b + " = " + (a * x - b), x, [Math.abs(a * x - 2 * b) / a, a * x, x + 3], "", "Some " + b + " aos dois lados: " + a + "x = " + (a * x) + ". Depois divida por " + a + ": x = " + x + ".", "A inversa da subtração é a soma."); },
  doisLados() { const x = sorteia(2, 12), a = sorteia(3, 7), b = sorteia(1, a - 1), c = sorteia(1, 12); return Q("Resolva: " + a + "x + " + c + " = " + (b === 1 ? "" : b) + "x + " + ((a - b) * x + c), x, [x + a - b, (a - b) * x, x + 5], "", "Tire " + b + "x e " + c + " dos dois lados: " + (a - b) + "x = " + ((a - b) * x) + ", então x = " + x + ".", "Junte os termos com x de um lado e os números do outro."); },
  verifica() { const x = sorteia(2, 10), a = sorteia(2, 6), b = sorteia(1, 12), v = a * x + b; return Q("Qual valor de x torna verdadeira a igualdade " + a + "x + " + b + " = " + v + "?", x, [x + 1, x + 2, x + 3], "", "Testando: " + a + " × " + x + " + " + b + " = " + v + ".", "Troque x por cada opção e faça a conta."); },
  orcamento() { const t = de([10, 15, 20, 25]), h = de([3, 4, 5, 6]), x = sorteia(2, 9); return Q("Uma impressão custa R$ " + t + " de taxa mais R$ " + h + " por hora. Um pedido saiu por R$ " + (t + h * x) + ". Quantas horas levou?", x, [(t + h * x) / h, t + x, x + 3].map(n => Math.round(n)), "horas", t + " + " + h + "x = " + (t + h * x) + ". " + h + "x = " + (h * x) + ". x = " + x + " horas.", "Monte a equação: taxa + preço por hora × x = total."); },
  dobroMais() { const x = sorteia(3, 15), a = sorteia(2, 12); return Q("Uma peça maior tem o dobro da massa de uma menor, mais " + a + " g. Se a maior tem " + (2 * x + a) + " g, qual é a massa da menor?", x, [2 * x + a - a / 2, x + a, 2 * x], "g", "2x + " + a + " = " + (2 * x + a) + ". 2x = " + (2 * x) + ". x = " + x + " g.", "Chame a massa menor de x e escreva: 2x + " + a + " = total."); },
  caixaX() { const a = sorteia(3, 7), b = sorteia(2, 5), x = sorteia(2, 9); return Q("Uma caixa de " + a + " cm por " + b + " cm por x cm tem volume de " + (a * b * x) + " cm³. Qual é o valor de x?", x, [a * b, a * b * x - a * b, x + 2], "cm", (a * b) + "x = " + (a * b * x) + ". x = " + x + " cm.", "Multiplique as medidas conhecidas e escreva a equação."); },
  perimetroX() { const x = sorteia(4, 20), l = sorteia(3, 12), P = 2 * (x + l); return Q("O perímetro de uma peça retangular, ou seja, a medida de todo o contorno, é de " + P + " cm. A largura é " + l + " cm. Qual é o comprimento?", x, [P - l, P / 2, x + l], "cm", "2(x + " + l + ") = " + P + ". x + " + l + " = " + (P / 2) + ". x = " + x + " cm.", "Metade do perímetro é comprimento + largura."); }
};

const PONTOS_MIN_FASE = 0.5;
const CAMADAS_POR_PERGUNTA = 3;
const PALAVROES = ["porra","caralho","merda","puta","viado","buceta","bosta","foda","piroca","cacete","arrombado","babaca","otario","vagabund","corno","fdp","vsf","pqp","nazi","hitler"];
const NOMES_A = ["Cateto","Raio","Diâmetro","Vértice","Trapézio","Losango","Binômio","Cilindro","Prisma","Cubo","Compasso","Hexágono"];
const NOMES_B = ["Exato","Infinito","Primo","Par","Ímpar","Inteiro","Decimal","Quadrado","Veloz","Agudo"];

const maxFase = f => {
  const seq = n => { let s = 0; for (let i = 0; i < n; i++) s += 100 + Math.min(i * 10, 50); return s; };
  return seq(f.itens.length) + (f.tipo === "tempo" ? f.itens.length * 50 : 0) + f.itens.length * CAMADAS_POR_PERGUNTA * 10;
};
const PONTOS_TOTAL = FASES.reduce((s, f) => s + maxFase(f), 0);

};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mistura = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const total = () => Object.values(J.melhor).reduce((s, n) => s + n, 0);
const passou = f => (J.melhor[f.id] || 0) >= maxFase(f) * PONTOS_MIN_FASE;
const liberada = f => f.id === 1 || passou(FASES[f.id - 2]);
const estrelas = (p, m) => { const r = p / m; return r >= .9 ? 3 : r >= .7 ? 2 : r >= .5 ? 1 : 0; };
const desenhaEstrelas = n => "★".repeat(n) + "☆".repeat(3 - n);
const salvar = () => { guarda.por("contaai:j:" + J.turma + ":" + J.apelido.toLowerCase(), J.melhor); guarda.por("contaai:ultimo", { apelido: J.apelido, turma: J.turma, nivel: nivelAtual }); };
const limpaTimer = () => { if (timer) { clearInterval(timer); timer = null; } };

const normaliza = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
const proibido = s => { const n = normaliza(s).replace(/0/g, "o").replace(/1/g, "i").replace(/3/g, "e").replace(/4/g, "a"); return PALAVROES.some(p => n.includes(p)); };

function bipPulo() {
  if (!som) return;
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const c = bip.c || (bip.c = new C()), o = c.createOscillator(), g = c.createGain();
    o.type = "square"; o.frequency.setValueAtTime(300, c.currentTime); o.frequency.linearRampToValueAtTime(520, c.currentTime + .1);
    g.gain.setValueAtTime(.025, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .12);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + .12);
  } catch {}
}
function bip(ok) {
  if (!som) return;
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const c = bip.c || (bip.c = new C()), o = c.createOscillator(), g = c.createGain();
    o.type = "square"; o.frequency.value = ok ? 660 : 130;
    if (ok) o.frequency.setValueAtTime(990, c.currentTime + .08);
    g.gain.setValueAtTime(.05, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .22);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + .22);
  } catch {}
}

const CUSTO_DICA = 30, PONTOS_CAMADA = 10;

  2: { fundo: "#CFF6EE", topo: "#22D3BE", dir: "#0E9C8C", esq: "#14B8A6" },
  3: { fundo: "#FFD6E5", topo: "#FF6FA3", dir: "#D93A75", esq: "#F0528B" },
  4: { fundo: "#FFF2B8", topo: "#FFD21F", dir: "#D9A400", esq: "#EFBA08" },
  5: { fundo: "#D8DBFF", topo: "#7C83FF", dir: "#4D50D6", esq: "#6268EE" },

const LAD = { x: "w", z: "d" };

const iso = (x, z, h, E, A) => [(x - z) * E, (x + z) * E * .5 - h * A];

/* Impressão de demonstração na tela inicial. */
function iniciaDemo() {

    const ops = mistura(it.o.map((t, k) => ({ t, k })));
    const m = document.createElement("div");
    m.className = "modal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-modal", "true"); m.setAttribute("aria-label", "Calibração " + n);
    m.innerHTML = '<div class="folha"><div class="linha" style="justify-content:space-between"><p class="etiqueta">Calibração ' + n + " de " + itens.length + '</p><p class="etiqueta">' + P.pontos + " pts · Sequência: " + P.seq + '</p></div>' +
      (f.tipo === "tempo" ? '<div class="tempo" role="timer" aria-label="Tempo restante"><div id="t" style="width:100%"></div></div>' : "") +
      '<p class="enunciado">' + it.q + '</p>' + (it.fig || "") +
      '<div class="opcoes">' + ops.map(o => '<button class="op" type="button" data-k="' + o.k + '">' + o.t + "</button>").join("") + '</div><div id="dica-area"><button class="bt" id="dica" type="button">Ver dica (−' + CUSTO_DICA + ' pontos)</button></div><div id="r"></div></div>';
    document.body.appendChild(m);
    const prim = m.querySelector(".op"); if (prim) prim.focus({ preventScroll: true });
    let usouDica = false;
    m.querySelector("#dica").onclick = () => { usouDica = true; m.querySelector("#dica-area").innerHTML = '<p class="curiosidade"><b>Dica:</b> ' + it.d + "</p>"; };
    function responde(k) {
      limpaTimer();
      const ok = k === it.a; let ganho = 0;
      if (ok) {
        ganho = 100 + Math.min(P.seq * 10, 50) - (usouDica ? CUSTO_DICA : 0); P.seq++;
        if (f.tipo === "tempo") ganho += Math.round(50 * Math.max(0, restante.v) / DIF.tempo);
        const t = topoDe(P.c), a = Math.min(DIF.base, t.w + 2), b = Math.min(DIF.base, t.d + 2);
        t.x -= (a - t.w) / 2; t.z -= (b - t.d) / 2; t.w = a; t.d = b;
        t.x = Math.round(t.x); t.z = Math.round(t.z);
      } else P.seq = 0;
      P.pontos += ganho; bip(ok); painel();
      const bd = m.querySelector("#dica"); if (bd) bd.remove();
      m.querySelectorAll(".op").forEach(o => {
        const q = +o.dataset.k; o.disabled = true;
        if (q === it.a) o.classList.add("certa"); else if (q === k) o.classList.add("errada"); else o.classList.add("apagada");
      });
      m.querySelector("#r").innerHTML = '<div class="retorno"><p><b>' + (k === -1 ? "O tempo acabou." : ok ? "Calibrada! +" + ganho + " pontos e a camada cresceu." : "Fora de calibração: sem pontos. Veja a conta:") + "</b> " + it.p + '</p><div class="linha fim"><button class="bt preto" id="prox" type="button">' + (n === itens.length ? "Ver a peça pronta" : "Continuar imprimindo") + "</button></div></div>";
      const b2 = m.querySelector("#prox"); b2.focus({ preventScroll: true }); b2.scrollIntoView({ block: "nearest" });
      b2.onclick = () => {
        m.remove(); P.pausa = false; P.ult = performance.now(); P.trava = 15; armaCamada(P.c); painel();
        if (n === itens.length) {
          const melhor = J.melhor[f.id] || 0;
          if (P.pontos >= melhor) guarda.por(chaveObra(f.id), P.c.camadas.map(c => [c.x, c.z, c.w, c.d]));
          pararJogo(); telaResultado(f, P.pontos);
        }
      };
    }
    m.querySelectorAll(".op").forEach(b => b.onclick = () => responde(+b.dataset.k));
    if (f.tipo === "tempo") {
      timer = setInterval(() => {
        restante.v -= .25;
        const bt = m.querySelector("#t"); if (bt) bt.style.width = Math.max(0, restante.v / DIF.tempo * 100) + "%";
        if (restante.v <= 0) responde(-1);
      }, 250);
    }
  }
  painel();
  P.raf = requestAnimationFrame(laco);
}

/* Prateleira: cada fase concluída guarda a peça exatamente como o aluno a imprimiu. */
const chaveObra = id => "contaai:o:" + J.turma + ":" + J.apelido.toLowerCase() + ":" + id;
function impressora() {
  const pol = (pts, ox, oy) => pts.map(q => (q[0] + ox).toFixed(1) + "," + (q[1] + oy).toFixed(1)).join(" ");
  let s = '<rect class="tabua" x="4" y="108" width="592" height="9" rx="4"/>';
  FASES.forEach((f, i) => {
    const ox = 50 + i * 100, oy = 104, obra = guarda.ler(chaveObra(f.id), null), t = TEMAS[f.id];
    if (!obra || !passou(f)) { s += '<path class="vaga" d="M' + (ox - 22) + " " + oy + "h44l-6 -30h-32z\"/>" + '<text x="' + ox + '" y="' + (oy - 10) + '" text-anchor="middle">' + f.id + "</text>"; return; }
    obra.forEach((c, h) => {
      const b = facesBloco({ x: c[0], z: c[1], w: c[2], d: c[3] }, h, 2.6, 3.4);
      s += '<polygon fill="' + t.dir + '" points="' + pol(b.dir, ox, oy) + '"/><polygon fill="' + t.esq + '" points="' + pol(b.esq, ox, oy) + '"/><polygon fill="' + t.topo + '" points="' + pol(b.topo, ox, oy) + '"/>';
    });
  });
  return '<svg class="impressora" viewBox="0 0 600 120" role="img" aria-label="Prateleira com ' + FASES.filter(passou).length + ' de 6 peças impressas">' + s + "</svg>";
}

/* ---------- RESULTADO ---------- */
function telaResultado(f, pts) {
  const m = maxFase(f), recorde = pts > (J.melhor[f.id] || 0);
  if (recorde) { J.melhor[f.id] = pts; salvar(); }
  enviaPontos();
  const ok = pts >= m * PONTOS_MIN_FASE, prox = FASES[f.id], tudo = FASES.every(passou);
  mostra(barra() + '<section class="folha fita"><p class="etiqueta">Fase ' + f.id + " · " + f.titulo + '</p><p class="placar">' + pts + '<span style="font-size:.4em"> / ' + m + '</span></p>' +
    '<p class="grandes" aria-label="' + estrelas(pts, m) + ' de 3 estrelas">' + desenhaEstrelas(estrelas(pts, m)) + '</p>' +
    '<p class="rabisco">' + (recorde ? "Novo recorde nesta fase!" : "Seu recorde continua: " + J.melhor[f.id] + " pontos.") + '</p>' +
    "<p>" + (ok ? "Peça pronta e guardada na prateleira: <b>" + OBRAS[f.id - 1] + "</b>. Repita quando quiser para buscar 3 estrelas." : "Você precisa de pelo menos " + Math.ceil(m * PONTOS_MIN_FASE) + " pontos para abrir a próxima fase. Releia a página e tente de novo.") + '</p>' +
    '<div class="linha">' +
    (tudo ? '<button class="bt quente" id="fim" type="button">Ver minha prateleira</button>' : (ok && prox ? '<button class="bt quente" id="seg" type="button">Próxima fase</button>' : "")) +
    '<button class="bt" id="rep" type="button">Jogar de novo</button><button class="bt" id="sum" type="button">Sumário</button></div></section>');
  ligaBarra(() => telaResultado(f, pts));
  document.getElementById("rep").onclick = () => telaLeitura(f);
  document.getElementById("sum").onclick = telaMapa;
  if (tudo) document.getElementById("fim").onclick = telaFinal;
  else if (ok && prox) document.getElementById("seg").onclick = () => telaLeitura(prox);
}

/* ---------- RANKING: online com a função Netlify, local como reserva ---------- */
function rankLocal(turma) {
  const l = guarda.ler("contaai:rank", []);
  return l.filter(p => !turma || p.turma === turma);
}
function guardaLocal() {
  const l = guarda.ler("contaai:rank", []).filter(p => !(p.apelido.toLowerCase() === J.apelido.toLowerCase() && p.turma === J.turma));
  l.push({ apelido: J.apelido, turma: J.turma, pontos: total(), nivel: nivelAtual });
  guarda.por("contaai:rank", l);
}
async function enviaPontos() {
  guardaLocal();
  try {
    await fetch("/api/ranking", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ apelido: J.apelido, turma: J.turma, pontos: total(), nivel: nivelAtual }) });
  } catch {}
}
async function buscaRanking(turma) {
  try {
    const r = await fetch("/api/ranking?turma=" + encodeURIComponent(turma), { cache: "no-store" });
    if (!r.ok) throw 0;
    const d = await r.json();
    if (!Array.isArray(d.jogadores)) throw 0;
    return { online: true, lista: d.jogadores };
  } catch {
    return { online: false, lista: rankLocal(turma) };
  }
}
async function telaRanking(voltar) {
  const temTurma = !!J.turma;
  if (!temTurma) abaRank = "todas";
  mostra(barra() + '<section class="folha fita"><div><p class="etiqueta">Quadro de honra</p><h2>Ranking</h2></div>' +
    (temTurma ? '<div class="abas"><button type="button" data-a="turma" aria-pressed="' + (abaRank === "turma") + '">Turma ' + esc(J.turma) + '</button><button type="button" data-a="todas" aria-pressed="' + (abaRank === "todas") + '">Todas as turmas</button></div>' : "") +
    '<div id="lista"><p class="etiqueta">Carregando…</p></div><div class="linha"><button class="bt" id="v" type="button">Voltar</button></div></section>');
  ligaBarra(voltar);
  document.getElementById("v").onclick = voltar;
  app.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { abaRank = b.dataset.a; telaRanking(voltar); });
  const { online, lista } = await buscaRanking(abaRank === "turma" ? J.turma : "");
  const el = document.getElementById("lista"); if (!el) return;
  const ord = lista.slice().sort((a, b) => b.pontos - a.pontos).slice(0, 20);
  el.innerHTML = (ord.length ? '<ol class="tab">' + ord.map((p, i) => {
    const eu = p.apelido.toLowerCase() === J.apelido.toLowerCase() && p.turma === J.turma;
    return '<li class="' + (eu ? "eu" : "") + '"><span class="pos">' + (i + 1) + 'º</span><span class="nm">' + esc(p.apelido) + (p.turma && abaRank !== "turma" ? " <small>" + esc(p.turma) + "</small>" : "") + (DIFICULDADES[p.nivel] ? " <small>" + DIFICULDADES[p.nivel].nome + "</small>" : "") + '</span><span class="pt">' + p.pontos + "</span></li>";
  }).join("") + "</ol>" : "<p>Ninguém pontuou ainda. Termine uma fase para aparecer aqui.</p>") +
    '<p class="etiqueta" style="margin-top:10px">' + (online ? "Ranking online: atualiza para todos." : "Ranking deste aparelho: mostra só quem jogou aqui.") + "</p>";
}

/* ---------- CAPA FINAL ---------- */
function telaFinal() {
  const ptsTotal = total();
  mostra(barra() + '<section class="folha fita"><p class="etiqueta">Prateleira de</p>' + recorte(J.apelido.toUpperCase(), true) +
    '<p class="placar">' + ptsTotal + '<span style="font-size:.4em"> / ' + PONTOS_TOTAL + '</span></p>' +
    impressora() + '<p class="rabisco">Todas as peças prontas! Agora é sua vez de calcular de verdade.</p>' +
    '<div class="leitura"><p>Você viu a área mudar a cada camada e usou área para ver se a peça cabe, volume e capacidade para calcular o material, e equações para descobrir medidas que faltavam.</p>' +
    '<p class="curiosidade"><b>Desafio para a sala maker:</b> escolha uma peça real da oficina. Meça, calcule o volume, estime a massa e o custo, e depois compare com o que o programa de fatiamento indicar.</p></div>' +
    '<div class="linha"><button class="bt quente" id="r" type="button">Ver ranking</button><button class="bt" id="s" type="button">Sumário</button></div></section>');
  ligaBarra(telaFinal);
  document.getElementById("r").onclick = () => telaRanking(telaFinal);
  document.getElementById("s").onclick = telaMapa;
}

telaInicio();
</script>
