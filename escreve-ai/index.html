<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escreve Aí!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Oswald:wght@500;600&display=swap">
<style>
/* Layout: oficina tipográfica. Bancada de madeira escura, tipos de chumbo para tocar e provas em papel-jornal. */
:root {
  color-scheme: dark;
  --madeira: #2B1A10;
  --madeira-clara: #4A2E1B;
  --veio: #352113;
  --latao: #D9A93F;
  --latao-escuro: #8E6A1E;
  --chumbo: #AEB4BA;
  --chumbo-claro: #DDE1E4;
  --chumbo-escuro: #5E656C;
  --papel: #ECE9DE;
  --tinta: #16120E;
  --cinza: #5A544A;
  --vermelho: #C9281A;
  --verde: #1F7A4A;
  --display: "Abril Fatface", Georgia, serif;
  --texto: "Libre Baskerville", Georgia, serif;
  --placa: "Oswald", "Arial Narrow", sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: repeating-linear-gradient(92deg, var(--madeira) 0 34px, var(--veio) 34px 37px, var(--madeira) 37px 81px, #271709 81px 83px);
  color: var(--papel);
  font: 400 1rem/1.6 var(--texto);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px;
}
#app { max-width: 840px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3, p { margin: 0; }
h2 { font: 400 clamp(1.7rem, 5.4vw, 2.5rem)/1.1 var(--display); text-wrap: balance; }
h3 { font: 400 1.25rem/1.15 var(--display); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--latao); outline-offset: 2px; }

/* Prova em papel-jornal */
.papel { position: relative; background: var(--papel); color: var(--tinta); padding: clamp(16px, 4vw, 30px); display: flex; flex-direction: column; gap: 14px; box-shadow: 0 2px 0 #fff inset, 0 10px 22px rgba(0, 0, 0, .55); min-width: 0; }
.etiqueta { font: 500 .8rem/1.35 var(--placa); letter-spacing: .09em; text-transform: uppercase; color: var(--cinza); }
.filete { border: 0; border-top: 3px double var(--tinta); margin: 0; }
.leitura { display: flex; flex-direction: column; gap: 12px; max-width: 66ch; }
.olho { border-left: 5px solid var(--vermelho); padding: 4px 0 4px 12px; font-style: italic; }
.aviso { border: 1px solid var(--tinta); padding: 10px 12px; font-size: .9rem; }
.erro { color: var(--vermelho); font-weight: 700; min-height: 1.5em; font-size: .92rem; }

/* Placa de latão com parafusos */
.bt { min-height: 50px; padding: 10px 20px; border: 0; background: linear-gradient(180deg, #F0C766, var(--latao) 55%, #B98C2C); color: var(--tinta); box-shadow: 0 4px 0 var(--latao-escuro), 0 6px 10px rgba(0, 0, 0, .35); font: 600 1.02rem/1.1 var(--placa); letter-spacing: .06em; text-transform: uppercase; transition: transform .07s, box-shadow .07s; }
.bt:hover:not(:disabled) { filter: brightness(1.06); }
.bt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--latao-escuro); }
.bt:disabled { opacity: .45; cursor: not-allowed; }
.bt.sec { background: var(--papel); box-shadow: 0 4px 0 #9d988a; }
.bt.sec:active:not(:disabled) { box-shadow: 0 1px 0 #9d988a; }
.papel .bt.sec { background: #fff; box-shadow: inset 0 0 0 2px var(--tinta); }
.linha { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.linha.fim { justify-content: flex-end; }

/* Título em tipos de chumbo */
.composto { display: flex; flex-wrap: wrap; gap: 4px; }
.composto span { display: grid; place-items: center; width: clamp(38px, 10.5vw, 62px); height: clamp(52px, 14vw, 84px); font: 400 clamp(1.8rem, 7.4vw, 3.2rem)/1 var(--display); color: var(--chumbo-claro); text-shadow: 0 -1px 0 #000; background: linear-gradient(135deg, #7C838A, var(--chumbo-escuro) 60%, #40464C); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2), 0 4px 0 #2a2e32; animation: encaixa .3s backwards; }
.composto.menor span { width: clamp(26px, 7vw, 38px); height: clamp(36px, 9vw, 50px); font-size: clamp(1.1rem, 4.6vw, 1.9rem); }
.composto i { width: 16px; }
@keyframes encaixa { from { transform: translateY(-26px); opacity: 0; } }
.subtitulo { font: 400 1.1rem/1.4 var(--texto); font-style: italic; color: var(--latao); }

.campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 190px; }
.campo label { font: 600 .92rem/1.2 var(--placa); letter-spacing: .06em; text-transform: uppercase; }
.campo input { min-height: 50px; width: 100%; padding: 8px 12px; border: 2px solid var(--tinta); background: #fff; font: 400 1.05rem/1.2 var(--texto); }
.campo input::placeholder { color: var(--cinza); }
.niveis { margin: 0; padding: 0; border: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 8px; }
.niveis legend { font: 600 .92rem/1.2 var(--placa); letter-spacing: .06em; text-transform: uppercase; padding: 0 0 5px; }
.nivel { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 2px solid var(--tinta); background: #fff; cursor: pointer; }
.nivel:has(input:checked) { background: var(--tinta); color: var(--papel); }
.nivel input { margin: 5px 0 0; accent-color: var(--vermelho); }
.nivel span { display: flex; flex-direction: column; min-width: 0; }
.nivel b { font: 600 1rem/1.2 var(--placa); letter-spacing: .04em; }
.nivel small { font-size: .78rem; line-height: 1.3; }

/* Plaqueta do jogador */
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 7px 12px; background: linear-gradient(180deg, #E8BE5E, var(--latao)); color: var(--tinta); box-shadow: 0 3px 0 var(--latao-escuro); font: 500 .92rem/1.2 var(--placa); letter-spacing: .03em; }
.barra strong { font: 400 1.25rem/1 var(--display); font-variant-numeric: tabular-nums; }
.barra .esp { flex: 1; }
.barra button { min-height: 38px; padding: 4px 10px; background: transparent; border: 1.5px solid var(--tinta); font: 500 .84rem/1 var(--placa); letter-spacing: .04em; }

/* Gaveta de tipos: o menu de fases */
.gaveta { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 235px), 1fr)); gap: 6px; padding: 8px; background: #1B0F07; box-shadow: inset 0 0 0 3px var(--madeira-clara), inset 0 6px 14px #000; }
.casa { text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 12px; min-height: 134px; border: 0; color: var(--papel); background: linear-gradient(160deg, var(--madeira-clara), #38220F); box-shadow: inset 0 0 0 1px #66472c; }
.casa:hover:not(:disabled) { background: linear-gradient(160deg, #5C3B23, #452A14); }
.casa:disabled { opacity: .5; cursor: not-allowed; }
.casa .le { font: 400 2rem/1 var(--display); color: var(--latao); }
.casa .tg { font: 500 .78rem/1.3 var(--placa); letter-spacing: .05em; color: var(--chumbo-claro); }
.casa .pe { margin-top: auto; padding-top: 6px; display: flex; justify-content: space-between; gap: 8px; font: 500 .88rem/1.2 var(--placa); }
.estrelas { color: var(--latao); letter-spacing: .08em; }

/* Mesa de composição */
.enunciado { font: 700 clamp(1.02rem, 3vw, 1.22rem)/1.5 var(--texto); text-wrap: pretty; }
.progresso { display: flex; gap: 4px; }
.progresso i { flex: 1; height: 8px; background: #cfcbbd; }
.progresso i.ok { background: var(--verde); }
.progresso i.no { background: var(--vermelho); }
.progresso i.ag { background: var(--tinta); }
.tempo { height: 10px; background: #cfcbbd; }
.tempo div { height: 100%; background: var(--vermelho); transition: width .25s linear; }
.componedor { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; padding: 10px; background: #D3CFC1; box-shadow: inset 0 2px 5px rgba(0, 0, 0, .35); min-height: 74px; }
.vaga, .tipo { width: 44px; height: 54px; display: grid; place-items: center; font: 700 1.5rem/1 var(--texto); border: 0; padding: 0; }
.vaga { background: #B9B4A4; box-shadow: inset 0 2px 4px rgba(0, 0, 0, .4); color: var(--tinta); }
.vaga.cheia, .tipo { background: linear-gradient(135deg, var(--chumbo-claro), var(--chumbo) 55%, #8C9299); color: var(--tinta); box-shadow: inset 0 0 0 1px #fff8, 0 4px 0 var(--chumbo-escuro); }
.tipo:hover:not(:disabled) { filter: brightness(1.08); }
.tipo:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--chumbo-escuro); }
.tipo:disabled { visibility: hidden; }
.bandeja { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 14px 10px; background: #1B0F07; box-shadow: inset 0 0 0 3px var(--madeira-clara), inset 0 5px 12px #000; }
.acentuar { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.acentuar .tipo:disabled { visibility: visible; opacity: .55; filter: grayscale(1); cursor: default; }
.tipo.certo { background: var(--verde); color: #fff; }
.tipo.errado { background: var(--vermelho); color: #fff; }
.frase { display: flex; flex-wrap: wrap; align-items: center; row-gap: 6px; font-size: clamp(1.05rem, 3.2vw, 1.25rem); line-height: 1.4; }
.pal { padding: 4px 7px; border: 0; background: transparent; border-bottom: 2px dotted var(--cinza); margin: 0 2px; font-size: inherit; min-height: 42px; }
.pal:hover:not(:disabled) { background: #fff; }
.pal:disabled { cursor: default; border-bottom-color: transparent; }
.pal.marca { background: var(--vermelho); color: #fff; text-decoration: line-through; }
.pal.certa { background: var(--verde); color: #fff; }
.so { padding: 4px 2px; }
.brecha { width: 30px; height: 42px; padding: 0; border: 0; background: transparent; position: relative; font: 700 1.5rem/1 var(--texto); color: var(--vermelho); }
.brecha::after { content: ""; position: absolute; left: 50%; top: 8px; bottom: 8px; border-left: 1px dashed var(--cinza); }
.brecha[aria-pressed="true"]::after { display: none; }
.brecha:hover:not(:disabled) { background: #fff; }
.opcoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 8px; }
.op { min-height: 52px; padding: 9px 13px; text-align: left; background: #fff; border: 2px solid var(--tinta); line-height: 1.35; font-size: .95rem; }
.op:hover:not(:disabled) { background: var(--tinta); color: var(--papel); }
.op:disabled { cursor: default; color: var(--tinta); }
.op.certa { background: var(--verde); border-color: var(--verde); color: #fff; font-weight: 700; }
.op.certa::before { content: "✓ "; }
.op.errada { background: var(--vermelho); border-color: var(--vermelho); color: #fff; font-weight: 700; }
.op.errada::before { content: "✗ "; }
.op.apagada { opacity: .45; }
.citacao { border-top: 1px solid var(--tinta); border-bottom: 1px solid var(--tinta); padding: 10px 2px; font-style: italic; }
.retorno { border: 2px solid var(--tinta); padding: 12px 14px; background: #fff; display: flex; flex-direction: column; gap: 8px; font-size: .95rem; }
.retorno b { font-family: var(--texto); }

/* Prelo: a página desce e carimba */
.prelo { position: relative; height: 96px; overflow: hidden; background: #1B0F07; box-shadow: inset 0 0 0 3px var(--madeira-clara); }
.prelo .chapa { position: absolute; left: 14%; right: 14%; top: 0; height: 40px; background: linear-gradient(180deg, var(--chumbo), var(--chumbo-escuro)); box-shadow: 0 3px 0 #2a2e32; animation: desce 1s ease-in .2s both; }
.prelo .chapa::before { content: ""; position: absolute; left: 50%; bottom: 100%; width: 16px; height: 96px; margin-left: -8px; background: var(--latao); }
.prelo .folhinha { position: absolute; left: 18%; right: 18%; bottom: 8px; height: 30px; background: var(--papel); }
@keyframes desce { 0% { top: 0; } 45% { top: 18px; } 70% { top: 18px; } 100% { top: 0; } }
.placar { font: 400 clamp(2.7rem, 10vw, 4.4rem)/1 var(--display); font-variant-numeric: tabular-nums; }
.grandes { font-size: 1.9rem; letter-spacing: .1em; color: var(--vermelho); }
.abas { display: flex; flex-wrap: wrap; gap: 8px; }
.abas button { min-height: 44px; padding: 6px 12px; background: #fff; border: 2px solid var(--tinta); font: 500 .9rem/1 var(--placa); letter-spacing: .04em; }
.abas button[aria-pressed="true"] { background: var(--tinta); color: var(--papel); }
.tab { list-style: none; margin: 0; padding: 0; border-top: 3px double var(--tinta); }
.tab li { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 8px 4px; border-bottom: 1px solid var(--tinta); }
.tab li.eu { background: var(--latao); }
.tab .pos { font: 400 1.1rem/1 var(--display); }
.tab .nm { overflow-wrap: anywhere; }
.tab small { color: var(--cinza); font: 500 .76rem/1 var(--placa); }
.tab .pt { font: 400 1.1rem/1 var(--display); font-variant-numeric: tabular-nums; }

/* Primeira página do jornal */
.jornal { display: flex; flex-direction: column; gap: 10px; }
.cabeca { font: 400 clamp(1.9rem, 8vw, 3.4rem)/1.05 var(--display); text-align: center; }
.expediente { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font: 500 .8rem/1.3 var(--placa); letter-spacing: .05em; border-top: 1px solid var(--tinta); border-bottom: 3px double var(--tinta); padding: 4px 0; overflow-wrap: anywhere; }
.colunas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px 16px; }
.colunas article { min-width: 0; border-top: 1px solid var(--tinta); padding-top: 6px; }
.colunas article.falta { opacity: .35; }
.colunas p { font-size: .86rem; line-height: 1.5; }
.casa.larga { grid-column: 1 / -1; min-height: 0; background: linear-gradient(160deg, #6E2A1C, #4A1A10); box-shadow: inset 0 0 0 1px #A2523E; }
.casa.larga:hover:not(:disabled) { background: linear-gradient(160deg, #84341F, #5A2014); }
.leitura > .campo { flex: none; }
.campo textarea { width: 100%; padding: 10px 12px; border: 2px solid var(--tinta); background: #fff; font: 400 1rem/1.6 var(--texto); color: var(--tinta); resize: vertical; }
.regras, .erros { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
.regras li { color: var(--cinza); }
.regras li.ok { color: var(--verde); font-weight: 700; }
.erros { gap: 10px; margin-top: 6px; }
.erros li { border-top: 1px solid var(--tinta); padding-top: 8px; overflow-wrap: anywhere; }
.grupo { min-width: 0; }
.confere { margin: 0; padding: 10px 12px; border: 1px solid var(--tinta); display: flex; flex-direction: column; gap: 6px; font-size: .92rem; }
.confere legend { font: 600 .92rem/1.2 var(--placa); letter-spacing: .06em; text-transform: uppercase; padding: 0 5px; }
.confere label { display: flex; gap: 8px; align-items: flex-start; }
.confere input { margin-top: 5px; accent-color: var(--vermelho); }
.manchete { font: 400 clamp(1.4rem, 5vw, 2.2rem)/1.15 var(--display); overflow-wrap: anywhere; text-wrap: balance; }
.corpo { columns: 2 220px; column-gap: 20px; overflow-wrap: anywhere; font-size: .94rem; }
@media print {
  body { background: #fff; padding: 0; }
  .barra, .prelo, .linha { display: none !important; }
  .papel { box-shadow: none; padding: 0; }
}
@media (max-width: 460px) {
  .componedor { gap: 3px; padding: 8px 4px; }
  .vaga { width: 32px; height: 44px; font-size: 1.2rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
</style>
</head>

    teclaProva = e => { const n = +e.key; if (n >= 1 && n <= 4) { const b = area.querySelectorAll(".op:not(:disabled)")[n - 1]; if (b) b.click(); } };

function jogaFase(f) {
  const provas = montaProvas(f), marcas = []; let i = 0, pontos = 0, seq = 0;
  function prova() {
    const it = provas[i]; let restante = DIF.tempo, resolvida = false, encerra = () => {};
    mostra(barra() + '<section class="papel"><div class="linha" style="justify-content:space-between"><p class="etiqueta">' + f.titulo + " · Prova " + (i + 1) + " de " + provas.length + '</p><p class="etiqueta">' + pontos + " pts · Sequência: " + seq + '</p></div><div class="progresso" aria-hidden="true">' + provas.map((_, k) => '<i class="' + (marcas[k] === true ? "ok" : marcas[k] === false ? "no" : k === i ? "ag" : "") + '"></i>').join("") + "</div>" +
      (f.tipo === "tempo" ? '<div class="tempo" role="timer" aria-label="Tempo restante"><div id="t" style="width:100%"></div></div>' : "") +
      '<div id="area" class="leitura" style="max-width:none"></div><div id="r"></div><div class="linha"><button class="bt sec" id="sair" type="button">Sair da seção</button></div></section>');
    ligaBarra(() => telaLeitura(f));
    document.getElementById("sair").onclick = f.tipo === "caderno" ? telaCaderno : telaMapa;
    const fim = (ok, certo, esgotou) => {
      if (resolvida) return; resolvida = true; limpaTimer(); teclaProva = null;
      let ganho = 0;
      const caderno = f.tipo === "caderno";
      if (ok) { ganho = caderno ? 0 : 100 + Math.min(seq * 10, 50); seq++; if (f.tipo === "tempo") ganho += Math.round(50 * Math.max(0, restante) / DIF.tempo); tiraErro(it.id); } else { seq = 0; poeErro(it.id); }
      pontos += ganho; marcas[i] = ok; bip(ok ? "ok" : "no");
      const ult = i === provas.length - 1;
      document.getElementById("r").innerHTML = '<div class="retorno"><p><b>' + (esgotou ? "O tempo acabou." : ok ? (caderno ? "Corrigida! Saiu do caderno." : "Pode imprimir! +" + ganho + " pontos.") : caderno ? "Ainda não: ela continua no caderno." : "Essa prova voltou com erro.") + "</b> " + (certo ? "Forma certa: <b>" + esc(certo.replace(/\.$/, "")) + "</b>. " : "") + it.p + '</p><div class="linha fim"><button class="bt" id="prox" type="button">' + (ult ? (caderno ? "Voltar ao caderno" : "Rodar no prelo") : "Próxima prova") + "</button></div></div>";
      const p = document.getElementById("prox"); p.focus({ preventScroll: true }); p.scrollIntoView({ block: "nearest" });
      p.onclick = () => { if (!ult) { i++; prova(); } else if (caderno) telaCaderno(); else telaResultado(f, pontos); };
    };
    encerra = MONTA[it.t](it, document.getElementById("area"), (ok, certo) => fim(ok, certo)) || encerra;
    if (f.tipo === "tempo") {
      timer = setInterval(() => {
        restante -= .25;
        const b = document.getElementById("t"); if (b) b.style.width = Math.max(0, restante / DIF.tempo * 100) + "%";
        if (restante <= 0) { encerra(); fim(false, it.t === "escolha" ? null : formaCerta(it), true); }
      }, 250);
    }
  }
  prova();
}

/* ---------- CADERNO DE ERROS ---------- */
const chaveErros = () => "escreveai:e:" + J.turma + ":" + J.apelido.toLowerCase();
const listaErros = () => guarda.ler(chaveErros(), []);
function poeErro(id) { const l = listaErros(); if (!l.includes(id)) { l.push(id); guarda.por(chaveErros(), l); } }
function tiraErro(id) { guarda.por(chaveErros(), listaErros().filter(x => x !== id)); }
const todasProvas = () => Object.values(BANCO).flat();
const provasDoCaderno = () => { const l = listaErros(); return todasProvas().filter(it => l.includes(it.id)); };
function formaCerta(it) {
  if (it.t === "compor") return it.w;
  if (it.t === "acento") return it.com;
  if (it.t === "revisao") return it.f.replace(/\*.+?\*/, it.c);
  if (it.t === "virgula") return it.s;

}

const chaveReportagem = () => "escreveai:r:" + J.turma + ":" + J.apelido.toLowerCase();

/* Bloqueia o que dá para reconhecer sozinho. Quem avalia o texto é o professor. */
function problemaNoTexto(t) {
  if (/\S+@\S+\.\S+/.test(t)) return "Tire o e-mail do texto. O jornal não deve ter dados pessoais.";
  if (/\d{4,5}[\s.-]?\d{4}/.test(t)) return "Tire o número de telefone ou documento do texto.";
  const palavras = semAcento(t).toLowerCase().split(/[^a-z0-9]+/);
  if (palavras.some(w => PALAVROES.includes(w) || w.startsWith("vagabund"))) return "Troque as palavras ofensivas antes de guardar.";
  return "";
}

    '<p class="aviso"><b>Cuidado:</b> não escreva nome completo, telefone, endereço ou fotos de colegas. O texto fica só neste aparelho e não vai para o ranking.</p><p id="erro" class="erro" role="alert"></p>' +

/* ---------- RANKING: online com a função Netlify, local como reserva ---------- */
function rankLocal(turma) { return guarda.ler("escreveai:rank", []).filter(p => !turma || p.turma === turma); }
function guardaLocal() {
  const l = guarda.ler("escreveai:rank", []).filter(p => !(p.apelido.toLowerCase() === J.apelido.toLowerCase() && p.turma === J.turma));
  l.push({ apelido: J.apelido, turma: J.turma, pontos: total(), nivel: nivelAtual });
  guarda.por("escreveai:rank", l);
}
async function enviaPontos() {
  guardaLocal();
  try { await fetch("/api/ranking", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ apelido: J.apelido, turma: J.turma, pontos: total(), nivel: nivelAtual }) }); } catch {}
}
async function buscaRanking(turma) {
  try {
    const r = await fetch("/api/ranking?turma=" + encodeURIComponent(turma), { cache: "no-store" });
    if (!r.ok) throw 0;
    const d = await r.json();
    if (!Array.isArray(d.jogadores)) throw 0;
    return { online: true, lista: d.jogadores };
  } catch { return { online: false, lista: rankLocal(turma) }; }
}
async function telaRanking(voltar) {
  if (!J.turma) abaRank = "todas";
  mostra(barra() + '<section class="papel"><div><p class="etiqueta">Quadro de tipógrafos</p><h2>Ranking</h2></div>' + (J.turma ? '<div class="abas"><button type="button" data-a="turma" aria-pressed="' + (abaRank === "turma") + '">Turma ' + esc(J.turma) + '</button><button type="button" data-a="todas" aria-pressed="' + (abaRank === "todas") + '">Todas as turmas</button></div>' : "") + '<div id="lista"><p class="etiqueta">Carregando…</p></div><div class="linha"><button class="bt sec" id="v" type="button">Voltar</button></div></section>');
  ligaBarra(voltar);
  document.getElementById("v").onclick = voltar;
  app.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { abaRank = b.dataset.a; telaRanking(voltar); });
  const { online, lista } = await buscaRanking(abaRank === "turma" ? J.turma : "");
  const el = document.getElementById("lista"); if (!el) return;
  const ord = lista.slice().sort((a, b) => b.pontos - a.pontos).slice(0, 20);
  el.innerHTML = (ord.length ? '<ol class="tab">' + ord.map((p, i) => {
    const eu = p.apelido.toLowerCase() === J.apelido.toLowerCase() && p.turma === J.turma;
    return '<li class="' + (eu ? "eu" : "") + '"><span class="pos">' + (i + 1) + 'º</span><span class="nm">' + esc(p.apelido) + (p.turma && abaRank !== "turma" ? " <small>" + esc(p.turma) + "</small>" : "") + (NIVEIS[p.nivel] ? " <small>" + NIVEIS[p.nivel].nome + "</small>" : "") + '</span><span class="pt">' + p.pontos + "</span></li>";
  }).join("") + "</ol>" : "<p>Ninguém pontuou ainda. Termine uma seção para aparecer aqui.</p>") + '<p class="etiqueta" style="margin-top:10px">' + (online ? "Ranking online: atualiza para todos." : "Ranking deste aparelho: mostra só quem jogou aqui.") + "</p>";
}

function telaFinal() {
  const r = reportagem();
  mostra(barra() + '<div class="prelo" aria-hidden="true"><div class="chapa"></div><div class="folhinha"></div></div><section class="papel jornal"><h2 class="cabeca">Jornal da Sala Maker</h2><div class="expediente"><span>Edição fechada no prazo</span><span>Tipografia: ' + esc(J.apelido) + "</span><span>" + total() + " / " + PONTOS_TOTAL + ' pontos</span></div>' + (r ? materia(r) : '<h3 class="manchete">Turma imprime o próprio jornal, letra por letra</h3><p>Sua reportagem ainda não entrou nesta edição. Escreva a sua para ocupar este espaço.</p>') + '<div class="colunas">' + FASES.map(f => '<article><h3>' + f.titulo + "</h3><p>" + f.resumo + " " + desenhaEstrelas(estrelas(J.melhor[f.id] || 0, maxFase(f))) + "</p></article>").join("") + '</div><p class="olho"><b>Desafio para a sala maker:</b> crie o jornal ou fanzine da turma. Escreva as notícias, revise em dupla, faça a capa e imprima na oficina.</p>' + (r ? botoesTexto() : "") + '<div class="linha"><button class="bt" id="edita" type="button">' + (r ? "Editar reportagem" : "Escrever reportagem") + '</button><button class="bt sec" id="r" type="button">Ver ranking</button><button class="bt sec" id="s" type="button">Gaveta</button></div></section>');
  ligaBarra(telaFinal);
  ligaTexto();
  document.getElementById("edita").onclick = telaRedacao;
  document.getElementById("r").onclick = () => telaRanking(telaFinal);
  document.getElementById("s").onclick = telaMapa;
}

telaInicio();
</script>
